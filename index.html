<style>
/* Layout: iOS style grouped lists. Segmented tabs up top, live totals in a frosted bar fixed to the bottom. Light theme only. */

  --bg:#f2f2f7; --card:#ffffff; --sep:rgba(60,60,67,.16); --label:#1c1c1e; --sec:rgba(60,60,67,.62);

  --title:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.4;padding:20px 16px 120px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.banner{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--blue) 35%,transparent)}

.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;text-transform:none;letter-spacing:0;font-family:var(--font)}

.big{font-size:clamp(36px,8vw,48px);font-weight:700;letter-spacing:-.025em;line-height:1.05}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tile .k{font-size:12.5px;color:var(--sec)}
.tile .v{font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}

.chartbox svg{margin:0 auto}
svg text{fill:var(--sec);font-family:var(--font);font-size:11px}
.tablebox{background:var(--card);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:10px 12px;text-align:right}
th{font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;border-bottom:.5px solid var(--sep)}

tr:last-child td{border-bottom:0}

.invgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:900px){.invgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepper{display:inline-grid;grid-template-columns:36px 36px 36px;align-items:center;background:var(--seg);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:transparent;color:var(--label);font:500 20px var(--font);height:32px;cursor:pointer}
.stepper span{text-align:center;font-weight:600}
.selectwrap select{font:500 15px var(--font);color:var(--blue);background:transparent;border:0;outline:none;text-align:right;cursor:pointer;max-width:220px}
.btn{border:0;background:transparent;color:var(--blue);font:400 16px var(--font);cursor:pointer;padding:12px 16px;text-align:left;width:100%}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;position:relative;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sep);margin:1px 0 0;flex-shrink:0;cursor:pointer;display:grid;place-items:center;background:var(--card)}
.check input:checked{background:var(--green);border-color:var(--green)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check .lbl{gap:2px}
.check input:checked ~ .lbl > span:first-child{color:var(--sec);text-decoration:line-through}
.src{display:grid;gap:4px;padding:12px 16px;position:relative}
.src+.src::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.src a{color:var(--blue);text-decoration:none;font-size:13.5px;overflow-wrap:anywhere}
.src b{font-weight:600;font-size:15px}
.src span{font-size:13.5px;color:var(--sec)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.bar .in{max-width:1100px;margin:0 auto;display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.bar .m{display:grid}
.bar .m span{font-size:12px;color:var(--sec)}
.bar .m b{font-size:18px;font-weight:600;letter-spacing:-.01em}
button:focus-visible,select:focus-visible,.check input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:520px){body{padding-bottom:150px}.inp input{width:96px}.inp input.name{width:130px}.tabs button{font-size:13px}.row.wrapme .seg{width:100%}.seg button{padding:6px 6px;font-size:12.5px}.bar .in{gap:8px 16px}.bar .m b{font-size:16px}.val{max-width:55%;white-space:normal}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ==== MODEL ====
const DEFAULTS = {
  projectName: "Co-living build", location: "Brisbane, QLD", startMonth: "2026-11",
  land: 780000, otherLand: 0,
  subdivide: "yes", lots: 2, lotsSell: 1, lotPrice: 480000, settleMonths: 1.5, subMonths: 10, lotSettleMonths: 2,
  survey: 15000, councilFees: 12000, infraPerLot: 18800, civil: 45000, connections: 20000, titles: 6000,
  buildRetail: 740000, build: 620000, bootsFee: 0, contingency: 7, plant: 45000, furniture: 25000, otherUpfront: 30000, loanFees: 2500,
  buildMonths: 10, buildStart: "titles", leaseUpMonths: 1, finishedValue: 1000000,
  lvr: 80, rate: 7.1, loanType: "io", term: 30, payDown: "yes",
  rentMode: "rooms", rooms: 5, roomRent: 360, weeklyRent: 900, vacancyWeeks: 3, pmPct: 10, lettingFees: 1800,
  councilRates: 3400, water: 1800, insurance: 3200, maintenance: 3000, utilities: 6000, internet: 1300, cleaning: 2000,
  taxRate: 32, valueGrowth: 5, rentGrowth: 3.5, costGrowth: 3, sellCostPct: 2.5, sellYear: 10,
  investorCount: 4, splitMode: "equal", builder: 0, bootsYears: 10, bootsRate: 0,
  investors: [
    { name: "Boots",  share: 25, rate: "", tax: "", fund: "loan", jointWith: -1, payback: "weekly" },
    { name: "Jordy",  share: 25, rate: "", tax: "", fund: "boots", jointWith: 3, payback: "weekly" },
    { name: "Joel",   share: 25, rate: "", tax: "", fund: "boots", jointWith: -1, payback: "undecided" },
    { name: "Bonnie", share: 25, rate: "", tax: "", fund: "boots", jointWith: 1, payback: "weekly" },
  ],
  checks: {},
  schema: 2
};

const num = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const isSub = p => p.subdivide === "yes";
const isRooms = p => p.rentMode === "rooms";

// QLD transfer duty, general rate (QRO, current at Oct 2026)
function qldDuty(v){
  if (v <= 5000) return 0;
  if (v <= 75000) return (v-5000)*0.015;
  if (v <= 540000) return 1050 + (v-75000)*0.035;
  if (v <= 1000000) return 17325 + (v-540000)*0.045;
  return 38025 + (v-1000000)*0.0575;
}
// QLD land tax, individuals (QRO, current at Oct 2026). Co-owned land is assessed together as one owner first.
function qldLandTax(v){
  if (v < 600000) return 0;
  if (v < 1000000) return 500 + (v-600000)*0.01;
  if (v < 3000000) return 4500 + (v-1000000)*0.0165;
  if (v < 5000000) return 37500 + (v-3000000)*0.0125;
  if (v < 10000000) return 62500 + (v-5000000)*0.0175;
  return 150000 + (v-10000000)*0.0225;
}
function irr(flows){
  if (!(flows[0] < 0)) return null;
  const npv = r => flows.reduce((s,f,i)=>s+f/Math.pow(1+r,i),0);
  let lo=-0.99, hi=5;
  if (npv(lo)*npv(hi) > 0) return null;
  for (let i=0;i<200;i++){ const m=(lo+hi)/2; (npv(lo)*npv(m)<=0)?hi=m:lo=m; }
  return (lo+hi)/2;
}
const PAYBACK = ["weekly","cash","sale","refinance","undecided"];
const jointOf = raw => { const n = parseFloat(raw); return isFinite(n) ? Math.round(n) : -1; };
function investorsOf(p){
  const cnt = clamp(Math.round(num(p.investorCount))||1, 1, 10);
  const builderIdx = clamp(Math.round(num(p.builder)), 0, cnt-1);
  const list = [];
  for (let i=0;i<cnt;i++){
    const iv = (p.investors||[])[i] || {};
    let fund = ["loan","boots","cash","undecided"].includes(iv.fund) ? iv.fund : "loan";
    if (i===builderIdx && fund==="boots") fund = "loan";
    list.push({ i, name: (iv.name||"").trim() || `Investor ${i+1}`, share: p.splitMode==="equal" ? 100/cnt : num(iv.share),
      rateRaw: iv.rate ?? "", taxRaw: iv.tax ?? "", fund, isBuilder: i===builderIdx, jointWith: jointOf(iv.jointWith),
      payback: PAYBACK.includes(iv.payback) ? iv.payback : "weekly" });
  }
  // people who borrow together form one loan group
  const parent = list.map((_,i)=>i);
  const find = i => parent[i]===i ? i : (parent[i] = find(parent[i]));
  list.forEach((x,i)=>{ const j = x.jointWith; if (j>=0 && j<cnt && j!==i){ const a=find(i), b=find(j); if (a!==b) parent[Math.max(a,b)] = Math.min(a,b); } });
  const map = {}; list.forEach((x,i)=>{ const r=find(i); (map[r]=map[r]||[]).push(i); });
  const groups = Object.values(map).sort((a,b)=>a[0]-b[0]);
  const tot = list.reduce((s,x)=>s+x.share,0);
  list.forEach(x=>{ x.s = tot>0 ? x.share/tot : 1/cnt; x.tax = x.taxRaw==="" ? num(p.taxRate) : num(x.taxRaw); });
  groups.forEach((members, gi)=>{
    let gf = list[members[0]].fund; if (members.includes(builderIdx) && gf==="boots") gf = "loan";
    const rawRate = members.map(i=>list[i].rateRaw).find(r=>r!=="");
    const gr = rawRate===undefined ? num(p.rate) : num(rawRate);
    const gp = list[members[0]].payback;
    members.forEach(i=>{ list[i].fund = gf; list[i].rate = gr; list[i].payback = gp; list[i].group = gi; list[i].joint = members.length>1; });
  });
  return { list, shareTotal: tot, builderIdx, groups };
}

function run(p, o={}){
  const n = k => num(p[k]);
  const rateAdd = o.rateAdd || 0;
  const land=n("land"), lvr=clamp(n("lvr"),0,100)/100, sellPct=n("sellCostPct")/100;
  const sub = isSub(p);
  const lots = sub ? Math.max(1, Math.round(n("lots"))) : 1;
  const sell = sub ? clamp(Math.round(n("lotsSell")), 0, lots-1) : 0;
  const keep = lots - sell;

  const duty = qldDuty(land);
  const subCosts = sub ? n("survey")+n("councilFees")+n("civil")+n("connections")+n("titles")+n("infraPerLot")*(lots-1) : 0;
  const buildCost = n("build")*(1+n("contingency")/100) + n("bootsFee");
  const plant = Math.min(n("plant"), buildCost);
  const furniture=n("furniture"), other=n("otherUpfront"), loanFees=n("loanFees");
  const perLot = (land + duty + subCosts) / lots;
  const totalCost = land + duty + subCosts + buildCost + furniture + other + loanFees;
  const bankable = land + subCosts + buildCost;
  const saving = Math.max(0, n("buildRetail") - buildCost);

  const saleGross = sell * n("lotPrice");
  const saleNetPre = saleGross * (1 - sellPct);
  const lotProfit = saleNetPre - sell*perLot;

  const weeklyRent = isRooms(p) ? n("rooms")*n("roomRent") : n("weeklyRent");
  const keptLand = land*keep/lots;
  const startValue = n("finishedValue") || keep*perLot + buildCost;

  // timeline (months from start)
  const settleAt = Math.max(0, n("settleMonths"));
  const subMonths = sub ? Math.max(0, n("subMonths")) : 0;
  const titlesAt = settleAt + subMonths;
  const buildMonths = Math.max(0.5, n("buildMonths"));
  const buildStartAt = (p.buildStart==="titles" && sub) ? titlesAt : settleAt;
  const buildEnd = buildStartAt + buildMonths;
  const leaseUp = Math.max(0, n("leaseUpMonths"));
  const rentStart = buildEnd + leaseUp;
  const lotSaleAt = titlesAt + Math.max(0, n("lotSettleMonths"));

  // whole-property yearly figures
  let plantBal = plant + furniture, capWorksClaimed = 0;
  const capWorks = (buildCost - plant) * 0.025;
  const base = [];
  for (let y=1; y<=10; y++){
    const g = x => Math.pow(1+x/100, y-1);
    const rent = weeklyRent * Math.max(0, 52 - n("vacancyWeeks")) * g(n("rentGrowth"));
    const lv = keptLand*g(n("valueGrowth")), ov = n("otherLand")*g(n("valueGrowth"));
    const landTax = qldLandTax(lv+ov) - qldLandTax(ov);
    const running = (n("councilRates")+n("water")+n("insurance")+n("maintenance")+n("utilities")+n("internet")+n("cleaning")+n("lettingFees"))*g(n("costGrowth"));
    const pm = rent*n("pmPct")/100;
    const dep = capWorks + plantBal*0.2; plantBal *= 0.8; capWorksClaimed += capWorks;
    base.push({ y, rent, pm, running, landTax, costs: pm+running+landTax, dep, capClaimed: capWorksClaimed, value: startValue*Math.pow(1+n("valueGrowth")/100, y) });
  }

  const { list, shareTotal, builderIdx, groups: groupIdx } = investorsOf(p);
  const bootsYears = Math.max(1, Math.round(n("bootsYears")));
  const bootsRate = Math.max(0, n("bootsRate"))/100;
  const Y = clamp(Math.round(n("sellYear"))||10, 1, 10);

  // pass 1: each person's loan, debt to the builder, holding costs
  const inv = list.map(iv => {
    const s = iv.s, rPct = iv.rate + rateAdd, r = rPct/100, tax = iv.tax/100;
    const owes = iv.fund === "boots";
    const pb = owes ? iv.payback : null;                    // how they pay the builder back
    const pbEff = pb==="undecided" ? "weekly" : pb;         // not decided yet: weekly is assumed for the maths
    const bankL = iv.fund==="cash" ? 0 : lvr;             // bank share of land and subdivision
    const bankB = (iv.fund==="cash" || owes) ? 0 : lvr;    // bank share of the build
    const loan0 = s*(bankL*(land+subCosts) + bankB*buildCost);
    const debt0 = owes ? s*buildCost : 0;
    const refi = pbEff==="refinance" ? debt0 : 0;          // new bank loan when built, pays the builder out
    const payNow = pbEff==="cash" ? debt0 : 0;             // cash to the builder when built
    const subInt = sub ? s*bankL*(land + subCosts/2)*r*subMonths/12 : 0;
    const landLoanDuringBuild = s*bankL*(land+subCosts) * ((p.payDown==="yes" && sell>0) ? keep/lots : 1);
    const buildInt = (landLoanDuringBuild + s*bankB*buildCost*0.5)*r*buildMonths/12;
    const hold = subInt + buildInt, holdTaxBack = hold*tax;
    const lotTax = Math.max(0, s*lotProfit)*tax;
    const lotCash = s*saleNetPre - lotTax;
    let loan = loan0, cashBack = 0;
    if (sell > 0){
      if (p.payDown==="yes" && lotCash>0){ const pay = Math.min(loan, lotCash); loan -= pay; cashBack = lotCash - pay; }
      else cashBack = lotCash;
    }
    // what goes to the builder each year: weekly P and I, or interest only until the sale
    let sched = null;
    if (owes && debt0>0 && pbEff==="weekly"){
      sched = []; let bal = debt0; const wr = bootsRate/52, nw = bootsYears*52;
      const pmt = wr===0 ? bal/nw : bal*wr/(1-Math.pow(1+wr,-nw));
      for (let y=1;y<=10;y++){ let i=0, pr=0; if (y<=bootsYears){ for (let w=0;w<52;w++){ const ii=bal*wr; i+=ii; const pp=Math.min(bal, Math.max(0,pmt-ii)); pr+=pp; bal-=pp; } } sched.push({int:i, prin:pr, bal}); }
      sched.weekly = pmt;
    } else if (owes && debt0>0 && pbEff==="sale"){
      sched = []; for (let y=1;y<=10;y++) sched.push({int: debt0*bootsRate, prin: 0, bal: debt0});
      sched.weekly = debt0*bootsRate/52;
    }
    const stages = {
      settle: s*(land*(1-bankL) + duty + loanFees),
      sub: s*subCosts*(1-bankL) + subInt,
      build: s*buildCost*(1-bankB) - debt0 + buildInt,
      payBoots: payNow,
      fitout: s*(furniture + other),
      lotBack: -cashBack,
      taxBack: -holdTaxBack,
    };
    const cashIn = stages.settle + stages.sub + stages.build + stages.payBoots + stages.fitout + stages.lotBack + stages.taxBack;
    return { ...iv, rPct, r, tax, owes, pb, pbEff, loan0, loan, debt0, refi, payNow, subInt, buildInt, hold, holdTaxBack, lotTax, lotCash, cashBack, sched, stages, cashIn, fronted:0, returned:0 };
  });

  // pass 2: the builder fronts the build for anyone who owes. Cash and new-loan payers square up when it's built.
  const builder = inv[builderIdx];
  const allOwers = inv.filter(x=>x.owes && x.debt0>0);
  const owers = allOwers.filter(x=>x.sched);
  builder.fronted = allOwers.reduce((a,x)=>a+x.debt0,0);
  builder.returned = allOwers.filter(x=>!x.sched).reduce((a,x)=>a+x.debt0,0);
  builder.stages.build += builder.fronted;
  builder.stages.payBoots -= builder.returned;
  builder.cashIn += builder.fronted - builder.returned;

  // pass 3: yearly rows for each person
  inv.forEach(iv => {
    const s=iv.s, r=iv.r, tax=iv.tax, mr=r/12, nm=Math.max(1, n("term")*12);
    const bankAtStart = iv.loan + iv.refi;
    const pmt = p.loanType==="pi" ? (mr===0 ? bankAtStart/nm : bankAtStart*mr/(1-Math.pow(1+mr,-nm))) : 0;
    let bal = bankAtStart, prevV = s*startValue;
    iv.rows = base.map((b,yi) => {
      let interest=0, principal=0;
      if (p.loanType==="pi"){ for (let m=0;m<12;m++){ const i=bal*mr; interest+=i; const pr=Math.min(bal,Math.max(0,pmt-i)); principal+=pr; bal-=pr; } }
      else interest = bal*r;
      const bootsInt = iv.sched ? iv.sched[yi].int : 0, bootsPrin = iv.sched ? iv.sched[yi].prin : 0, bootsBal = iv.sched ? iv.sched[yi].bal : 0;
      let recvInt=0, recvPrin=0, recvBal=0;
      if (iv.isBuilder) owers.forEach(x=>{ recvInt+=x.sched[yi].int; recvPrin+=x.sched[yi].prin; recvBal+=x.sched[yi].bal; });
      const rent=s*b.rent, pm=s*b.pm, running=s*b.running, landTax=s*b.landTax, costs=s*b.costs, dep=s*b.dep;
      const borrowCost = yi<5 ? s*loanFees/5 : 0;
      const taxable = rent - costs - interest - bootsInt - dep - borrowCost + recvInt;
      const taxBack = -taxable*tax;
      const before = rent - costs - interest - principal - bootsInt - bootsPrin + recvInt + recvPrin;
      const after = before + taxBack;
      const value = s*b.value;
      const equity = value - bal - bootsBal + recvBal;
      const gain = after + (value - prevV); prevV = value;
      return { y:b.y, rent, pm, running, landTax, costs, interest, principal, bootsInt, bootsPrin, bootsBal, recvInt, recvPrin, recvBal, dep, taxBack, before, after, value, bal, equity, gain };
    });
    const last = iv.rows[Y-1];
    const sellGross = last.value*(1-sellPct);
    const costBase = s*(keep*perLot + buildCost + furniture + other - base[Y-1].capClaimed);
    iv.cgt = Math.max(0, sellGross - costBase)*0.5*tax;
    iv.saleNet = sellGross - last.bal - last.bootsBal + last.recvBal - iv.cgt;
    iv.profit = iv.rows.slice(0,Y).reduce((a,x)=>a+x.after,0) + iv.saleNet - iv.cashIn;
    iv.flows = [-iv.cashIn, ...iv.rows.slice(0,Y).map((x,i)=>x.after + (i===Y-1 ? iv.saleNet : 0))];
    iv.irr = irr(iv.flows);
    iv.weeklyRepay = (iv.rows[0].interest + iv.rows[0].principal)/52;
    iv.weeklyBoots = iv.sched ? iv.sched.weekly : 0;
    iv.weeklyRecv = iv.isBuilder ? (iv.rows[0].recvInt + iv.rows[0].recvPrin)/52 : 0;
  });

  const sum = f => inv.reduce((a,x)=>a+x[f],0);
  const keys = ["rent","pm","running","landTax","costs","interest","principal","bootsInt","bootsPrin","bootsBal","recvInt","recvPrin","recvBal","dep","taxBack","before","after","value","bal","equity","gain"];
  const rows = base.map((b,i)=>{ const o={y:b.y}; keys.forEach(k=>o[k]=inv.reduce((a,x)=>a+x.rows[i][k],0)); return o; });
  const flows = inv[0].flows.map((_,i)=>inv.reduce((a,x)=>a+x.flows[i],0));
  const stageTotals = {}; ["settle","sub","build","payBoots","fitout","lotBack","taxBack"].forEach(k=>stageTotals[k]=inv.reduce((a,x)=>a+x.stages[k],0));

  // loan groups: a couple borrowing together is one loan, one payback, one pocket
  const sumKeys = ["s","loan0","loan","debt0","refi","payNow","hold","holdTaxBack","cashIn","fronted","returned","lotTax","cashBack","cgt","saleNet","profit","weeklyRepay","weeklyBoots","weeklyRecv"];
  const groups = groupIdx.map((members, gi)=>{
    const ms = members.map(i=>inv[i]);
    const g = { gi, members: ms, name: ms.map(x=>x.name).join(" and "), joint: ms.length>1, isBuilder: ms.some(x=>x.isBuilder), owes: ms.some(x=>x.owes), fund: ms[0].fund, pb: ms[0].pb, pbEff: ms[0].pbEff, rPct: ms[0].rPct, i: ms[0].i };
    sumKeys.forEach(k=>g[k]=ms.reduce((a,x)=>a+x[k],0));
    g.lvrAfter = g.s>0 && startValue>0 ? (g.loan + g.refi)/(g.s*startValue) : 0;
    g.rows = base.map((b,i)=>{ const o={y:b.y}; keys.forEach(k=>o[k]=ms.reduce((a,x)=>a+x.rows[i][k],0)); return o; });
    g.flows = ms[0].flows.map((_,i)=>ms.reduce((a,x)=>a+x.flows[i],0)); g.irr = irr(g.flows);
    g.stages = {}; Object.keys(ms[0].stages).forEach(k=>g.stages[k]=ms.reduce((a,x)=>a+x.stages[k],0));
    return g;
  });

  const weeklyG = groups.filter(g=>g.owes && g.pbEff==="weekly"), saleG = groups.filter(g=>g.owes && g.pbEff==="sale");
  const bootsBar = weeklyG.length ? { label:`Pay ${builder.name} back`, years: Math.min(10, bootsYears) } : saleG.length ? { label:`Owe ${builder.name} until sale`, years: Y } : null;

  return { duty, subCosts, buildCost, saving, totalCost, bankable, loanStart:sum("loan0"), loan:sum("loan"), refi:sum("refi"), owed:owers.reduce((a,x)=>a+x.debt0,0), fronted:builder.fronted, returned:builder.returned,
    holdInt:sum("hold"), holdTaxBack:sum("holdTaxBack"), cashIn:sum("cashIn"), lotTax:sum("lotTax"), cashBack:sum("cashBack"),
    cgt:sum("cgt"), saleNet:sum("saleNet"), profit:sum("profit"), weeklyRepay:sum("weeklyRepay"), irr: irr(flows),
    rows, inv, groups, builder, owers, allOwers, shareTotal, sell, keep, lots, perLot, saleGross, lotProfit, weeklyRent, Y, stageTotals, startValue,
    grossYield: (weeklyRent*52)/(keep*perLot + buildCost),
    tl: { settleAt, subMonths, titlesAt, buildStartAt, buildEnd, leaseUp, rentStart, lotSaleAt, buildMonths, sub, sell, bootsYears, hasOwers: owers.length>0, bootsBar, hasPayBoots: builder.returned>0 } };
}

function breakeven(p, target){
  const k = isRooms(p) ? "roomRent" : "weeklyRent";
  let lo=0, hi=isRooms(p)?5000:20000;
  const f = v => run({...p,[k]:v}).rows[0][target];
  if (f(hi) < 0) return null;
  for (let i=0;i<50;i++){ const m=(lo+hi)/2; f(m)<0 ? lo=m : hi=m; }
  return hi;
}

// monthly cumulative cash the group needs
function cashSeries(R){
  const t = R.tl, st = R.stageTotals;
  const end = Math.ceil(t.rentStart) + 1;
  const out = new Array(end+1).fill(0);
  const add = (m, v) => { const i = clamp(Math.round(m), 0, end); out[i] += v; };
  const spread = (a, b, v) => { const n = Math.max(1, Math.round(b-a)); for (let i=0;i<n;i++) add(a+i+1, v/n); };
  add(t.settleAt, st.settle);
  if (t.sub) spread(t.settleAt, t.titlesAt, st.sub);
  spread(t.buildStartAt, t.buildEnd, st.build);
  add(t.buildEnd, st.payBoots);
  add(t.buildEnd, st.fitout);
  if (t.sell) add(t.lotSaleAt, st.lotBack);
  add(t.rentStart, st.taxBack);
  let c=0; return out.map(v => c += v);
}

const unb64u = s => { const t = s.replace(/-/g,"+").replace(/_/g,"/"); const bin = atob(t + "=".repeat((4 - t.length%4)%4)); return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0))); };
function mergePlan(obj){
  const out = {...DEFAULTS};
  if (obj && typeof obj==="object") Object.keys(DEFAULTS).forEach(k=>{ if (obj[k]!==undefined) out[k]=obj[k]; });
  if (!Array.isArray(out.investors)) out.investors = DEFAULTS.investors;
  if (!out.checks || typeof out.checks!=="object") out.checks = {};
  // plans saved by earlier versions of this page: bring them up to date once
  const oldSchema = (obj && typeof obj==="object" && obj.schema!==undefined) ? num(obj.schema) : 0;
  if (oldSchema < 2){
    const names = out.investors.map(x=>((x&&x.name)||"").trim().toLowerCase());
    if (!out.investors.some(x=>x && x.jointWith!==undefined)){
      const j = names.indexOf("jordy"), b = names.indexOf("bonnie");
      if (j>=0 && b>=0) out.investors = out.investors.map((x,i)=> i===j ? {...x, jointWith:b} : i===b ? {...x, jointWith:j} : {...x, jointWith:-1});
    }
    const jo = names.indexOf("joel");
    if (jo>=0 && out.investors[jo] && !out.investors[jo].payback && ["undecided","cash"].includes(out.investors[jo].fund)) out.investors = out.investors.map((x,i)=> i===jo ? {...x, fund:"boots", payback:"undecided"} : x);
    out.schema = 2;
  }
  return out;
}

}

    { label:"Own and rent it", a:0, b:Y, c:"var(--green)" },
  ].filter(Boolean);
  const W=640, L=150, rowH=30, T=26, B=22, H=T+rows.length*rowH+B;
  const x = y => L + (W-L-24)*y/10;
  const fits = x(Y) - 90 > L;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:760,minWidth:560,display:"block"}} role="img" aria-label="Ten year plan">
      {Array.from({length:11},(_,i)=>i).map(i=>(<g key={i}>
        <line x1={x(i)} x2={x(i)} y1={T-6} y2={H-B} stroke="var(--sep)"/>
        <text x={x(i)} y={T-12} textAnchor={i===0?"end":"middle"} dx={i===0?6:0}>{i===0?"Rent starts":"Yr "+i}</text>
      </g>))}
      {rows.map((s,i)=>{ const y0=T+i*rowH; return (<g key={s.label}>
        <text x={L-10} y={y0+rowH/2+4} textAnchor="end" style={{fill:"var(--label)",fontSize:12.5}}>{s.label}</text>
        <rect x={x(s.a)} y={y0+6} width={Math.max(4,x(s.b)-x(s.a))} height={rowH-12} rx="6" fill={s.c} opacity=".85"/>
        <text x={x(s.a)+8} y={y0+rowH/2+4} style={{fontSize:11,fill:"#fff",fontWeight:600}}>{(s.b-s.a)} {s.b-s.a===1?"year":"years"}</text>
      </g>); })}
      <line x1={x(Y)} x2={x(Y)} y1={T-4} y2={H-B+4} stroke="var(--label)" strokeDasharray="3 3" opacity=".7"/>
      <text x={fits ? x(Y)-4 : x(Y)+4} y={H-6} textAnchor={fits?"end":"start"} style={{fill:"var(--label)",fontWeight:600}}>Sell or review</text>
    </svg>
  );
}

function CashLine({series, startMonth}){
  const W=560,H=200,L=56,B=24,T=12;
  const max = Math.max(...series, 1)*1.1, min = Math.min(0, ...series);
  const y = v => T + (H-T-B)*(1-(v-min)/(max-min));
  const x = i => L + (W-L-10)*i/Math.max(1, series.length-1);
  const step = Math.pow(10, Math.floor(Math.log10(max/3))), tick = Math.ceil(max/3/step)*step;
  const pts = series.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const lab = Math.max(1, Math.ceil(series.length/8));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:720,minWidth:380,display:"block"}} role="img" aria-label="Cash needed over time">
      {[0,1,2,3].map(i=>tick*i<=max && (<g key={i}>
        <line x1={L} x2={W-4} y1={y(tick*i)} y2={y(tick*i)} stroke="var(--sep)"/>
        <text x={L-8} y={y(tick*i)+4} textAnchor="end">{axisMoney(tick*i)}</text>
      </g>))}
      <polyline points={pts} fill="none" stroke="var(--blue)" strokeWidth="2.5" strokeLinejoin="round"/>
      <polygon points={`${x(0)},${y(0)} ${pts} ${x(series.length-1)},${y(0)}`} fill="var(--blue)" opacity=".08"/>
      {series.map((v,i)=> i%lab===0 && <text key={i} x={x(i)} y={H-6} textAnchor="middle">{monthLabel(startMonth,i)}</text>)}
      <circle cx={x(series.length-1)} cy={y(series[series.length-1])} r="4" fill="var(--blue)"/>
    </svg>
  );
}

function App(){
  const [p,setP] = useState(INITIAL);
  const [tab,setTab] = useState("summary");
  const [view,setView] = useState("all");
  const [toastMsg,setToastMsg] = useState(HASH_PLAN ? "Loaded the shared plan" : null);
  const [pending,setPending] = useState(null);
  const [copyBox,setCopyBox] = useState(null);
  const [syncState,setSyncState] = useState("off");
  const [syncUrlRepo,setSyncUrlRepo] = useState("");
  const [syncUrlLocal,setSyncUrlLocal] = useState(LOCAL_SYNC);
  const syncUrl = looksLikeSyncUrl(syncUrlRepo) ? syncUrlRepo.trim() : looksLikeSyncUrl(syncUrlLocal) ? syncUrlLocal.trim() : "";
  const pRef = React.useRef(p); useEffect(()=>{ pRef.current = p; },[p]);
  const sync = React.useRef({ remote:null, canWrite:false, dirty:false, ready:false, failed:false, lastWritten:0, remoteStamp:0, t:null, q:Promise.resolve() });
  useEffect(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} },[p]);
  useEffect(()=>{ try{ localStorage.setItem(KEY+"-sync", syncUrlLocal); }catch(e){} },[syncUrlLocal]);
  useEffect(()=>{ if (!toastMsg) return; const t=setTimeout(()=>setToastMsg(null), 3200); return ()=>clearTimeout(t); },[toastMsg]);
  const toast = m => setToastMsg(m);

  const markSeen = key => { try{ localStorage.setItem(KEY+"-seen", key); }catch(e){} };
  // our changes since the last shared plan we saw, laid over the newest shared plan, so two people editing at once don't wipe each other
  const mergeOnto = (latest, base, mine) => {
    if (!latest || !base) return mine;
    const out = {...latest};
    Object.keys(DEFAULTS).forEach(k=>{ if (k!=="checks" && JSON.stringify(mine[k])!==JSON.stringify(base[k])) out[k]=mine[k]; });
    const checks = {...(latest.checks||{})}, mc = mine.checks||{}, bc = base.checks||{};
    Object.keys({...mc, ...bc}).forEach(id=>{ if (mc[id]!==bc[id]) checks[id]=mc[id]; });
    out.checks = checks;
    return mergePlan(out);
  };
  const scheduleWrite = () => {
    const s = sync.current; if (!s.remote || !s.canWrite) return;
    clearTimeout(s.t);
    s.t = setTimeout(()=>{ s.q = s.q.then(async()=>{
      const mine = mergePlan(pRef.current);
      try {
        let latest = null; try { latest = s.remote.latest ? await s.remote.latest() : null; } catch(e){ latest = null; }
        const merged = mergeOnto(latest, s.base, mine);
        const stamp = await s.remote.write(merged);
        s.lastWritten = stamp; s.remoteStamp = stamp; s.base = merged; s.failed = false; setSyncState("on");
        const typedMeanwhile = planKey(pRef.current) !== planKey(mine);
        if (planKey(merged) !== planKey(mine) && !typedMeanwhile){ setP(merged); s.dirty = false; }
        else s.dirty = typedMeanwhile;
      }
      catch(e){ if (e && e.code==="invalid_argument"){ s.canWrite=false; setSyncState("readonly"); } else { s.failed = true; setSyncState("error"); } }
    }); }, 1000);
  };
  // a plan arrived from the shared store: take it, or ask if this device has its own changes
  const takeRemote = (plan) => {
    const s = sync.current;
    if (planKey(plan) !== planKey(pRef.current)){
      if (!s.dirty && (s.ready || !HAD_LOCAL)){ s.base = plan; applyPlan(plan); }
      else setPending({ source:"shared", plan });
    } else s.base = plan;
    s.ready = true;
  };
  const change = fn => { setP(fn); sync.current.dirty = true; scheduleWrite(); };
  const applyPlan = (plan, key) => { setP(plan); sync.current.dirty=false; setPending(null); if (key) markSeen(key); toast("Shared plan loaded"); };
  const set = (k,v)=>change(o=>({...o,[k]:v}));
  const setCheck = (k,v)=>change(o=>({...o, checks:{...(o.checks||{}), [k]:v}}));
  const blankInv = (n, share) => ({ name:`Investor ${n}`, share, rate:"", tax:"", fund:"loan", jointWith:-1 });
  const setInv = (i,k,v)=>change(o=>{ const a=[...(o.investors||[])]; while(a.length<=i) a.push(blankInv(a.length+1, 0)); a[i]={...a[i],[k]:v}; return {...o,investors:a}; });
  const setInvMany = (ids,k,v)=>change(o=>{ const a=[...(o.investors||[])]; ids.forEach(i=>{ while(a.length<=i) a.push(blankInv(a.length+1, 0)); a[i]={...a[i],[k]:v}; }); return {...o,investors:a}; });
  const setCount = c => change(o=>{
    c = clamp(c,1,10);
    const a=[...(o.investors||[])]; while(a.length<c) a.push(blankInv(a.length+1, Math.round(100/c)));
    return {...o, investorCount:c, investors:a, builder: clamp(num(o.builder),0,c-1)};
  });

  // live sync through the claude.ai viewer, when this page is opened there
  useEffect(()=>{
    if (!IN_VIEWER) return;
    let unsub=null, cancelled=false;
    (async()=>{
      try {
        const db = await window.claude.use("db"); if (!db || cancelled) return;
        const user = await window.claude.use("user");
        let cw = null; try { cw = user ? await user.can("data.write") : null; } catch(e){}
        const s = sync.current;
        s.remote = {
          kind:"db",
          latest: async () => { const snap = await db.doc("plan/current").get(); return snap.exists ? ((snap.data()||{}).plan || null) : null; },
          write: async plan => { const stamp = Date.now(); s.lastWritten = stamp; await db.doc("plan/current").set({ plan, updatedAt: stamp }); return stamp; }
        };
        s.canWrite = cw !== false;
        setSyncState(cw===false ? "readonly" : "on");
        unsub = db.doc("plan/current").onSnapshot(snap=>{
          if (!snap.exists){ if (!s.ready && HAD_LOCAL && s.canWrite) scheduleWrite(); s.ready = true; return; }
          const d = snap.data() || {}; const stamp = Number(d.updatedAt)||0;
          if (stamp && stamp===s.lastWritten) { s.ready = true; return; }
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          takeRemote(mergePlan(d.plan||{}));
        }, ()=>setSyncState("off"));
      } catch(e){ setSyncState("off"); }
    })();
    return ()=>{ cancelled=true; if (unsub) unsub(); };
  },[]);

  // GitHub copy: sync.json names the Google script that holds the shared plan. No script, then plan.json is the agreed copy.
  useEffect(()=>{
    if (IN_VIEWER) return;
    (async()=>{
      let url = "";
      try { const r = await fetch("sync.json", {cache:"no-store"}); if (r.ok){ const j = await r.json(); if (looksLikeSyncUrl(j.url)) url = j.url.trim(); } } catch(e){}
      if (url){ setSyncUrlRepo(url); return; }
      if (HASH_PLAN || looksLikeSyncUrl(LOCAL_SYNC)) return;
      try {
        const res = await fetch("plan.json", {cache:"no-store"}); if (!res.ok) return;
        const j = await res.json(); const plan = mergePlan(j.plan || j); const key = planKey(plan);
        let seen=null; try{ seen = localStorage.getItem(KEY+"-seen"); }catch(e){}
        if (key===seen) return;
        if (!HAD_LOCAL) applyPlan(plan, key);
        else if (key !== planKey(pRef.current)) setPending({ source:"github", plan, key });
        else markSeen(key);
      } catch(e){}
    })();
  },[]);

  // GitHub copy with a Google script: poll it, write to it
  useEffect(()=>{
    if (IN_VIEWER || !syncUrl) return;
    const s = sync.current; const ad = gasAdapter(syncUrl);
    s.remote = {
      kind:"gas",
      latest: async () => { const d = await ad.read(); return d && d.plan ? mergePlan(d.plan) : null; },
      write: async plan => { const r = await ad.write(plan); if (!r || !r.ok) throw new Error("write"); return Number(r.updatedAt) || Date.now(); }
    };
    s.canWrite = true; s.ready = false; s.failed = false; s.remoteStamp = 0; s.base = null;
    let stop = false, timer = null;
    setSyncState("connecting");
    const tick = async () => {
      if (stop) return;
      try {
        const d = await ad.read(); if (stop) return;
        const stamp = Number(d && d.updatedAt) || 0;
        if (!d || !d.plan){ if (!s.ready && HAD_LOCAL) scheduleWrite(); s.ready = true; }
        else if (stamp !== s.lastWritten && stamp !== s.remoteStamp){ s.remoteStamp = stamp; takeRemote(mergePlan(d.plan)); }
        else s.ready = true;
        if (s.failed && s.dirty) scheduleWrite(); else if (!s.failed) setSyncState("on");
      } catch(e){ setSyncState("error"); }
      timer = setTimeout(tick, (typeof document!=="undefined" && document.hidden) ? 30000 : 7000);
    };
    const onVis = () => { if (!document.hidden){ clearTimeout(timer); tick(); } };
    document.addEventListener("visibilitychange", onVis);
    tick();
    return ()=>{ stop = true; clearTimeout(timer); document.removeEventListener("visibilitychange", onVis); s.remote = null; setSyncState("off"); };
  },[syncUrl]);

  const copy = async (text, msg) => { try { await navigator.clipboard.writeText(text); toast(msg); setCopyBox(null); } catch(e){ setCopyBox(text); toast("Copy it from the box below"); } };
  const shareLink = () => copy(location.origin + location.pathname + location.search + "#plan-" + b64u(JSON.stringify(diffPlan(p))), "Link copied. Send it to the group");
  const copyPlanFile = () => copy(JSON.stringify({ plan: mergePlan(p), updatedAt: Date.now() }, null, 2), "Plan copied. Paste it into plan.json on GitHub");
  const loadPending = () => { const pd = pending; if (!pd) return; if (pd.source==="shared") sync.current.base = pd.plan; applyPlan(pd.plan, pd.key); };
  const keepMine = () => { const pd = pending; setPending(null); if (!pd) return; if (pd.source==="github") markSeen(pd.key); if (pd.source==="shared") { sync.current.dirty = true; scheduleWrite(); } };

  const R = useMemo(()=>run(p),[p]);
  const y1 = R.rows[0];
  const good = R.profit > 0;
  const stress = useMemo(()=>[
    ["Rates up 1%", run(p,{rateAdd:1})],
    ["Rates up 2%", run(p,{rateAdd:2})],
    ["Build costs 15% more", run({...p, build:num(p.build)*1.15})],
    ["Rent down 10%", run({...p, roomRent:num(p.roomRent)*0.9, weeklyRent:num(p.weeklyRent)*0.9})],
    ["6 more empty weeks", run({...p, vacancyWeeks:num(p.vacancyWeeks)+6})],
    ["Growth only 2%", run({...p, valueGrowth:2})],
  ],[p]);
  const beBefore = useMemo(()=>breakeven(p,"before"),[p]);
  const beAfter = useMemo(()=>breakeven(p,"after"),[p]);
  const series = useMemo(()=>cashSeries(R),[R]);
  const rentUnit = isRooms(p) ? "per room a week" : "a week";
  const multi = R.inv.length > 1;
  const B = R.builder;
  const undecided = R.groups.filter(g=>g.fund==="undecided");
  const viewInv = view==="all" ? null : view.startsWith("g:") ? R.groups[+view.slice(2)] : view.startsWith("i:") ? R.inv[+view.slice(2)] : null;
  const viewRows = viewInv ? viewInv.rows : R.rows;
  const Y = R.Y;

  const decisions = [
    ...undecided.map(g=>({ id:`fund-${g.i}`, label:`How ${g.joint?"are":"is"} ${g.name} paying for their ${(g.s*100).toFixed(0)}%?`, hint:`The numbers assume a bank loan for now. Pick Bank loan, Own cash or Owes ${B.name} on the People tab.` })),
    ...R.groups.filter(g=>g.joint && g.loan0>0).map(g=>({ id:`joint-${g.i}`, label:`${g.name}: one bank loan in both names`, hint:`Both go on the loan and each is liable for all of it. For tax, each claims the interest on their own ${g.members.map(m=>(m.s*100).toFixed(0)+"%").join(" and ")} share.` })),
    ...R.groups.filter(g=>g.owes && g.debt0>0).map(g=>
      g.pb==="undecided" ? { id:`payback-${g.i}`, label:`How ${g.joint?"are":"is"} ${g.name} paying ${B.name} back the ${money(g.debt0)}?`, hint:`Weekly over ${R.tl.bootsYears} years is assumed for now. Pick weekly, cash when built, from the sale or a new bank loan on the People tab.` }
      : g.pb==="weekly" ? { id:`boots-${g.i}`, label:`Written loan agreement: ${B.name} and ${g.name}`, hint:`${money(g.debt0)} paid back over ${R.tl.bootsYears} years at ${num(p.bootsRate)}%. Put the amount, rate, repayments and what happens if someone sells in writing.` }
      : g.pb==="cash" ? { id:`boots-${g.i}`, label:`${g.name}: have ${money(g.payNow)} ready for ${B.name} by ${monthLabel(p.startMonth,R.tl.buildEnd)}`, hint:"That's when the build finishes and he's paid in full." }
      : g.pb==="sale" ? { id:`boots-${g.i}`, label:`${g.name}: ${B.name} gets ${money(g.debt0)} out of the sale`, hint:`Put it in the co-ownership agreement so it comes off their share before the split${num(p.bootsRate)>0?`, plus ${num(p.bootsRate)}% interest along the way`:""}.` }
      : { id:`boots-${g.i}`, label:`${g.name}: check the bank will lend ${money(g.refi)} more once it's built`, hint:`Needs a valuation on completion. Total bank debt would be ${pct(g.lvrAfter)} of their share of the finished value. Lenders usually stop at 80%.` }),
    { id:"co-own", label:"Co-ownership agreement for all four", hint:"Who decides what, how someone exits, what happens if one person can't pay, how profits and losses are split. Tenants in common lets each person claim their own share of the loss." },
    num(p.bootsFee)===0 && { id:"boots-fee", label:`${B.name} builds at cost with no fee. Is everyone happy with that?`, hint:`The group saves about ${money(R.saving)} against an outside builder. Decide if ${B.name} gets paid for his time or a bigger share.` },
    { id:"lender", label:"Talk to a broker about four borrowers on one property", hint:"Banks usually put everyone on one loan and each person is liable for the lot. Some lenders do property share loans with a split per person. Check co-living is accepted and what LVR they'll give." },
    { id:"council", label:"Confirm council rules for rooming accommodation on this block", hint:"Brisbane allows up to 5 residents as accepted development if the zone and the rooming accommodation code allow it. Over 5 needs a development application. Other councils differ." },
    R.sell>0 && { id:"gst", label:"GST on the lot you sell", hint:"Selling a subdivided lot for profit can be treated as a business and attract GST. Ask about the margin scheme before you sign anything." },
    { id:"valuer", label:"Get a valuation on the finished house before you start", hint:`The plan assumes ${money(num(p.finishedValue))}. If the bank values it lower you'll need more cash.` },
    { id:"insurance", label:"Insurance that covers rooming accommodation", hint:"Standard landlord policies often exclude it." },
    { id:"rta", label:"Set up rooming accommodation agreements, not normal leases", hint:"In QLD each room is rented on a rooming accommodation agreement (RTA Form R18)." },
  ].filter(Boolean);

  return (<>
    {toastMsg && <div className="toast" role="status">{toastMsg}</div>}
    <div className="wrap">
      <header>
        <div className="htext">
          <span className="eyebrow">Queensland · Build and lease · {p.location || "QLD"}</span>
          <h1>{p.projectName || "Co-living Investment"}</h1>
        </div>
        <div className="hside">
          {syncState==="on" ? <span className="pill good">Live sync on</span>
            : syncState==="readonly" ? <span className="pill info">Live view, read only</span>
            : syncState==="error" ? <span className="pill warn">Sync problem, retrying</span>
            : syncState==="connecting" ? <span className="pill grey">Connecting</span>
            : IN_VIEWER ? <span className="pill grey">Saved on this device</span> : null}
          {!IN_VIEWER && <button type="button" className="hbtn" onClick={shareLink}>Share link</button>}
        </div>
      </header>

      {pending && <div className="banner">
        <div className="lbl">
          <span><b>{pending.source==="github" ? "The agreed plan on GitHub has changed." : "The shared plan has changed."}</b></span>
          <span className="hint">Load it and your numbers on this device get replaced. Keep yours{pending.source==="shared" && syncState==="on" ? " and it becomes the shared plan" : ""}.</span>
        </div>
        <div className="bbtns">
          <button type="button" className="hbtn" onClick={loadPending}>Load it</button>
          <button type="button" className="hbtn plain" onClick={keepMine}>Keep mine</button>
        </div>
      </div>}

      {copyBox && <div className="banner">
        <div className="lbl" style={{width:"100%"}}>
          <span><b>Copy didn't work automatically. Select this and copy it.</b></span>
          <textarea className="copybox" readOnly value={copyBox} onFocus={e=>e.target.select()} rows={3}/>
        </div>
        <div className="bbtns"><button type="button" className="hbtn plain" onClick={()=>setCopyBox(null)}>Close</button></div>
      </div>}

      <div className="tabwrap">
        <div className="tabs" role="tablist">
          {[["summary","Summary"],["costs","Costs"],["people","People"],["timeline","Timeline"],["years","10 Years"],["notes","Notes"]].map(([k,t])=>
            <button key={k} role="tab" aria-pressed={tab===k} aria-selected={tab===k} onClick={()=>setTab(k)}>{t}</button>)}
        </div>
      </div>

      {tab==="summary" && <div className="cols">
        <div className="stack">
          <div className="hero">
            <div className="pills">
              <span className={"pill "+(good?"good":"bad")}>{good ? "Makes money" : "Loses money"}</span>
              {undecided.map(g=><span key={g.i} className="pill warn">{g.name}: funding not decided</span>)}
              {R.groups.filter(g=>g.owes && g.pb==="undecided").map(g=><span key={"pb"+g.i} className="pill warn">{g.name}: payback to {B.name} not decided</span>)}
              {R.owers.length>0 && <span className="pill info">{B.name} fronts {money(R.fronted)} of the build</span>}
            </div>
            <div className={"big "+cls(R.profit)}>{signed(R.profit)}</div>
            <p>Profit for the group if sold in year {Y}, after tax and every cost.{R.irr!==null && ` About ${pct(R.irr)} a year on the cash put in.`}{multi && ` Split across ${R.inv.length} people.`}</p>
          </div>
          <div className="tiles">
            <div className="tile"><span className="k">Cash the group puts in</span><span className="v">{money(R.cashIn)}</span></div>
            <div className="tile"><span className="k">Bank loans</span><span className="v">{money(R.loan)}</span></div>
            <div className="tile"><span className="k">Owed to {B.name}</span><span className="v">{money(R.owed)}</span></div>
            <div className="tile"><span className="k">Year 1 per week, group</span><span className={"v "+cls(y1.after)}>{money(y1.after/52)}</span></div>
            <div className="tile"><span className="k">Rent yield on cost</span><span className="v">{(R.grossYield*100).toFixed(1)}%</span></div>
            <div className="tile"><span className="k">Months until first rent</span><span className="v">{Math.round(R.tl.rentStart)}</span></div>
            <div className="tile"><span className="k">Equity in year {Y}</span><span className="v">{money(R.rows[Y-1].equity)}</span></div>
            <div className="tile"><span className="k">Saved by {B.name} building</span><span className="v pos">{money(R.saving)}</span></div>
          </div>

          <Group title="Year 1 each week, whole property" footer="Tax back is the refund from claiming the loss and depreciation against wages. That's the negative gearing part. Payments between the group cancel out here, see People for each person.">
            <Val label="Rent in" value={money(y1.rent/52)} c="pos"/>
            <Val label="Property manager" value={money(-y1.pm/52)}/>
            <Val label="Running costs and letting" value={money(-y1.running/52)}/>
            <Val label="Land tax" value={money(-y1.landTax/52)}/>
            <Val label="Bank loan repayments" value={money(-(y1.interest+y1.principal)/52)}/>
            <Val label="Before tax" value={money(y1.before/52)} c={cls(y1.before)}/>
            <Val label="Tax back" value={signed(y1.taxBack/52)} c={cls(y1.taxBack)}/>
            <Val label="In pocket" value={money(y1.after/52)} c={cls(y1.after)} strong/>
          </Group>

          <Group title="Upfront money, whole group">
            <Val label="Land" value={money(num(p.land))}/>
            <Val label="Stamp duty" value={money(R.duty)}/>
            {isSub(p) && <Val label="Subdivision" value={money(R.subCosts)}/>}
            <Val label="Build incl contingency and fee" value={money(R.buildCost)}/>
            <Val label="Furniture, other, loan fees" value={money(num(p.furniture)+num(p.otherUpfront)+num(p.loanFees))}/>
            <Val label="Interest while building" value={money(R.holdInt)}/>
            <Val label="Tax back on that interest" value={money(-R.holdTaxBack)}/>
            <Val label="Less bank loans" value={money(-R.loanStart)}/>
            {R.sell>0 && <>
              <Val label={`Sale of ${R.sell} ${R.sell>1?"lots":"lot"}`} value={money(R.saleGross)}/>
              <Val label="Profit on lots sold" value={money(R.lotProfit)} c={cls(R.lotProfit)}/>
              <Val label="Tax on that profit" value={money(-R.lotTax)}/>
              {p.payDown==="yes" && <Val label="Paid off the loan" value={money(R.loanStart-R.loan)}/>}
              {R.cashBack>0 && <Val label="Cash back" value={money(-R.cashBack)}/>}
            </>}
            <Val label="Total cash in" hint={R.owers.length>0?`Includes the ${money(R.fronted)} ${B.name} fronts for others`:null} value={money(R.cashIn)} strong/>
          </Group>
        </div>

        <div className="stack">
          {multi && <Group title="Each person" right={<span>Cash in · Per week</span>} footer="Per week is year 1 after tax, after bank and builder repayments. People borrowing together are shown as one.">
            {R.groups.map(g=>(
              <Val key={g.i} label={<span className="namerow"><span>{g.name}</span><span className={"pill "+(g.fund==="undecided"?"warn":g.fund==="boots"?"info":"grey")}>{g.isBuilder?"Builder":g.fund==="boots"?`Owe${g.joint?"":"s"} ${B.name}`:FUND[g.fund]}</span>{g.joint && <span className="pill grey">One loan</span>}{g.owes && g.pb==="undecided" && <span className="pill warn">Payback not decided</span>}</span>}
                   hint={`${(g.s*100).toFixed(0)}% share${g.loan0>0?` · bank loan ${money(g.loan)}`:""}${g.debt0>0?` · owe${g.joint?"":"s"} ${money(g.debt0)}`:""}`}
                   value={<>{money(g.cashIn)} · <span className={cls(g.rows[0].after)}>{money(g.rows[0].after/52)}</span></>}/>
            ))}
          </Group>}

          <section className="gwrap">
            <div className="ghead"><span>Equity each year</span></div>
            <div className="chartbox"><Chart rows={R.rows} cashIn={R.cashIn}/></div>
            <div className="gfoot">What the group holds outright in the kept house. The line is the cash put in.</div>
          </section>

          <Group title="Stress test" right={<span>Per week · Profit yr {Y}</span>} footer="What happens if things go worse than planned.">
            <Val label="As entered" value={<>{money(y1.after/52)} · {money(R.profit)}</>} strong/>
            {stress.map(([t,s])=>(
              <Val key={t} label={t} value={<><span className={cls(s.rows[0].after)}>{money(s.rows[0].after/52)}</span> · <span className={cls(s.profit)}>{money(s.profit)}</span></>}/>
            ))}
          </Group>

          <Group title="Breakeven rent" footer={`Lowest rent ${rentUnit} so the property covers itself in year 1.`}>
            <Val label="Covers costs before tax" value={beBefore===null?"n/a":money(beBefore)}/>
            <Val label="Covers costs after tax back" value={beAfter===null?"n/a":money(beAfter)}/>
            <Val label="You've entered" value={money(isRooms(p)?num(p.roomRent):num(p.weeklyRent))} strong/>
          </Group>
        </div>
      </div>}

      {tab==="costs" && <div className="cols">
        {[0,1].map(col=>(
          <div className="stack" key={col}>
            {col===0 && <Group title="Project">
              <NumRow id="projectName" text label="Name" value={p.projectName} onChange={v=>set("projectName",v)}/>
              <NumRow id="location" text label="Suburb or area" value={p.location} onChange={v=>set("location",v)}/>
            </Group>}
            {SECTIONS.filter((s,i)=> (i<3)===(col===0)).filter(s=>!s.show||s.show(p)).map(s=>(
              <Group key={s.title} title={s.title}
                footer={s.title==="Land" ? `Stamp duty ${money(R.duty)}` :
                        s.title==="Subdivision" ? `Total subdivision ${money(R.subCosts)} · each lot costs ${money(R.perLot)} all up` :
                        s.title==="Build" ? `Build with contingency ${money(R.buildCost)} · saves ${money(R.saving)} against an outside builder` :
                        s.title==="Loan" ? `Bank loans ${money(R.loanStart)}${R.sell>0&&p.payDown==="yes"?` · ${money(R.loan)} after lot sale`:""} · interest while building ${money(R.holdInt)}` :
                        s.title==="Rent" ? `Full rent ${money(R.weeklyRent)} a week · ${money(R.weeklyRent*52)} a year before empty weeks` : null}>
                {s.fields.filter(f=>!f[4]||f[4](p)).map(([k,l,u,h,,o])=> u==="seg"
                  ? <SegRow key={k} label={l} hint={h} options={o} value={p[k]} onChange={v=>set(k,v)}/>
                  : <NumRow key={k} id={k} label={l} hint={h} unit={u} value={p[k]} onChange={v=>set(k,v)}/>)}
              </Group>
            ))}
            {col===1 && <Group><button className="btn" onClick={()=>change(o=>({...DEFAULTS, checks:o.checks||{}}))}>Reset to researched figures</button></Group>}
          </div>
        ))}
      </div>}

      {tab==="people" && <div className="stack">
        <div className="cols">
          <Group title="Ownership" warn={p.splitMode==="custom" && Math.abs(R.shareTotal-100)>0.01}
            footer={p.splitMode==="custom" && Math.abs(R.shareTotal-100)>0.01
              ? `Shares add up to ${R.shareTotal.toFixed(1)}%. They're scaled to 100% in the numbers.`
              : "Each person's bank loan covers their share of the land, subdivision and build. Leave a rate or tax rate blank to use the Costs tab default."}>
            <div className="row">
              <span className="lbl">People</span>
              <span className="stepper">
                <button type="button" aria-label="Fewer people" onClick={()=>setCount(R.inv.length-1)}>−</button>
                <span>{R.inv.length}</span>
                <button type="button" aria-label="More people" onClick={()=>setCount(R.inv.length+1)}>+</button>
              </span>
            </div>
            <SegRow label="Split" options={[["equal","Equal"],["custom","Custom"]]} value={p.splitMode} onChange={v=>set("splitMode",v)}/>
            <SelectRow id="builder" label="Who is the builder" options={R.inv.map(iv=>[String(iv.i), iv.name])} value={String(B.i)} onChange={v=>set("builder",v)}/>
          </Group>
          <Group title={`Paying ${B.name} back`} footer={`${B.name} pays for the build share of anyone set to "Owes ${B.name}". How each person pays him back is set on their card. ${R.allOwers.length>0?`Right now he fronts ${money(R.fronted)} during the build${R.returned>0?`, and ${money(R.returned)} of that comes straight back when it's built`:""}.`:"Nobody owes him right now."}`}>
            <NumRow id="bootsYears" label="Weekly payback runs for" unit="yrs" hint="For anyone paying weekly" value={p.bootsYears} onChange={v=>set("bootsYears",v)}/>
            <NumRow id="bootsRate" label={`Interest ${B.name} charges`} unit="%" hint="On weekly payback and on money owed until sale. 0 is no interest" value={p.bootsRate} onChange={v=>set("bootsRate",v)}/>
            {R.groups.filter(g=>g.owes && g.debt0>0).map(g=><Val key={g.i} label={`${g.name} pay${g.joint?"":"s"} ${B.name}`}
              hint={g.pb==="undecided"?`${money(g.debt0)}. Not decided how, weekly over ${R.tl.bootsYears} years assumed`:g.pb==="weekly"?`${money(g.debt0)} over ${R.tl.bootsYears} years`:g.pb==="cash"?`In cash when it's built, ${monthLabel(p.startMonth,R.tl.buildEnd)}`:g.pb==="sale"?`Out of the sale in year ${Y}${g.weeklyBoots>0?`, plus interest`:""}`:`From a new bank loan when it's built`}
              value={g.pbEff==="weekly"?money(g.weeklyBoots)+" a week":g.pbEff==="sale"&&g.weeklyBoots>0?money(g.weeklyBoots)+" a week interest":money(g.debt0)} c={g.pb==="undecided"?"warnc":""}/>)}
            {B.weeklyRecv>0 && <Val label={`${B.name} gets back each week`} value={money(B.weeklyRecv)} strong/>}
            {B.returned>0 && <Val label={`${B.name} gets back when it's built`} value={money(B.returned)} strong/>}
          </Group>
        </div>

        <div className="invgrid">
          {R.groups.map(g=>{
            const ids = g.members.map(m=>m.i);
            const lead = g.members[0];
            const leadSrc = (p.investors||[])[lead.i] || {};
            const r1 = g.rows[0];
            const fundOpts = [["loan","Bank loan"], ...(g.isBuilder?[]:[["boots",`Owe${g.joint?"":"s"} ${B.name}`]]), ["cash","Own cash"], ["undecided","Not decided"]];
            const others = R.inv.filter(x=>x.i!==lead.i);
            return (
              <div className="person" key={g.i} style={{"--pc": PCOLORS[g.i % PCOLORS.length]}}>
                <div className="phead">
                  <span className="avatar" aria-hidden="true">{g.members.map(m=>(m.name||"?").trim().charAt(0).toUpperCase()).join("")}</span>
                  <span className="pname">{g.name}</span>
                  {g.isBuilder && <span className="pill info">Builder</span>}
                  {g.joint && <span className="pill grey">One loan together</span>}
                  {g.fund==="undecided" && <span className="pill warn">Funding not decided</span>}
                  {g.owes && g.pb==="undecided" && <span className="pill warn">Payback not decided</span>}
                  <span className="pshare">{(g.s*100).toFixed(1)}%</span>
                </div>
                <Group
                  footer={g.fund==="undecided" ? `${g.name} ${g.joint?"haven't":"hasn't"} settled how they're paying. The maths uses a bank loan until you pick.` : g.owes && g.pb==="undecided" ? `${B.name} fronts ${g.joint?"their":"the"} ${money(g.debt0)} build share. How it gets paid back isn't decided yet, so weekly is assumed.` : g.fund==="cash" ? `No bank loan. ${g.joint?"They put their":"Puts the"} whole share in as cash.` : g.joint ? "One bank loan in both names. Each person still claims their own share of the interest and the loss for tax." : null} warn={g.fund==="undecided" || (g.owes && g.pb==="undecided")}>
                  {g.members.map(iv=>{ const src=(p.investors||[])[iv.i]||{}; return (<React.Fragment key={iv.i}>
                    {g.joint && <div className="subhead">{iv.name}</div>}
                    <NumRow id={`n${iv.i}`} text label="Name" value={src.name ?? iv.name} onChange={v=>setInv(iv.i,"name",v)}/>
                    {p.splitMode==="custom"
                      ? <NumRow id={`s${iv.i}`} label="Share" unit="%" value={src.share ?? ""} onChange={v=>setInv(iv.i,"share",v)}/>
                      : <Val label="Share" value={(iv.s*100).toFixed(1)+"%"}/>}
                    <NumRow id={`t${iv.i}`} label="Tax rate" unit="%" hint="Marginal rate incl Medicare" value={src.tax ?? ""} placeholder={String(p.taxRate)} onChange={v=>setInv(iv.i,"tax",v)}/>
                  </React.Fragment>); })}
                  {g.joint && <div className="subhead">Together</div>}
                  <SegRow label="How they pay for their share" options={fundOpts} value={g.fund} onChange={v=>setInvMany(ids,"fund",v)}/>
                  {g.fund==="boots" && <SegRow label={`How they pay ${B.name} back`} hint={g.pb==="undecided"?`Not decided yet. Weekly over ${R.tl.bootsYears} years is assumed in the maths until you pick`:g.pb==="weekly"?`Weekly over ${R.tl.bootsYears} years at ${num(p.bootsRate)}%. Change the terms under Paying ${B.name} back`:g.pb==="cash"?"Pay him in full when the build finishes":g.pb==="sale"?`He's paid out of the sale in year ${Y}${num(p.bootsRate)>0?`, with ${num(p.bootsRate)}% interest along the way`:", nothing until then"}`:"Borrow it from the bank once it's built and valued, then pay the bank"} options={[["weekly","Weekly"],["cash","Cash when built"],["sale","From the sale"],["refinance","New bank loan"],["undecided","Not decided"]]} value={g.pb} onChange={v=>setInvMany(ids,"payback",v)}/>}
                  <NumRow id={`r${lead.i}`} label="Bank interest rate" unit="%" value={leadSrc.rate ?? ""} placeholder={String(p.rate)} onChange={v=>setInvMany(ids,"rate",v)}/>
                  {g.joint
                    ? <div className="row"><span className="lbl">Borrowing together<span className="hint">Change this if they'd each take their own loan</span></span><button type="button" className="hbtn plain" onClick={()=>setInvMany(ids,"jointWith",-1)}>Split up</button></div>
                    : others.length>0 && <SelectRow id={`j${lead.i}`} label="Borrows with" hint="Pick someone to share one bank loan and one payback" options={[["-1","Nobody"], ...others.map(x=>[String(x.i), x.name])]} value="-1" onChange={v=>setInv(lead.i,"jointWith",v)}/>}
                </Group>
                <Group title="Their money up front">
                  <Val label="Share of all costs" value={money(g.s*R.totalCost)}/>
                  <Val label={g.joint?"One bank loan together":"Bank loan"} value={money(g.loan0)}/>
                  {g.loan0!==g.loan && <Val label="Bank loan after lot sale" value={money(g.loan)}/>}
                  {g.debt0>0 && g.pbEff==="weekly" && <Val label={`Owe${g.joint?"":"s"} ${B.name} for the build`} hint={g.pb==="undecided"?`How it's paid back isn't decided. Weekly over ${R.tl.bootsYears} years assumed`:`Paid back weekly over ${R.tl.bootsYears} years`} value={money(g.debt0)} c={g.pb==="undecided"?"warnc":""}/>}
                  {g.debt0>0 && g.pbEff==="cash" && <Val label={`Pay ${B.name} when built`} hint={`Cash needed ${monthLabel(p.startMonth,R.tl.buildEnd)}`} value={money(g.payNow)} c="warnc"/>}
                  {g.debt0>0 && g.pbEff==="sale" && <Val label={`Owe${g.joint?"":"s"} ${B.name} until sale`} hint={`Comes off their share of the sale in year ${Y}`} value={money(g.debt0)}/>}
                  {g.debt0>0 && g.pbEff==="refinance" && <Val label="New bank loan when built" hint={`Pays ${B.name} out. Total bank loans ${money(g.loan+g.refi)}, ${pct(g.lvrAfter)} of their share of the finished value${g.lvrAfter>0.8?". Over 80% is hard to get":""}`} value={money(g.refi)} c={g.lvrAfter>0.8?"warnc":""}/>}
                  {g.isBuilder && g.fronted>0 && <Val label="Fronts for others during the build" hint={g.returned>0?`${money(g.returned)} comes back when it's built`:null} value={money(g.fronted)} c="warnc"/>}
                  <Val label="Cash to put in" hint="Own share, interest while building, less loans and lot sale money" value={money(g.cashIn)} strong/>
                </Group>
                <Group title="Their money each week, year 1">
                  <Val label="Rent share" value={money(r1.rent/52)} c="pos"/>
                  <Val label="Costs share" value={money(-r1.costs/52)}/>
                  {g.loan+g.refi>0 && <Val label={`Bank repayment at ${g.rPct.toFixed(2)}%`} hint={`${money(g.weeklyRepay*52/12)} a month${g.refi>0?", includes the build loan":""}`} value={money(-g.weeklyRepay)}/>}
                  {g.debt0>0 && g.pbEff==="weekly" && <Val label={`Repayment to ${B.name}`} hint={`${money(g.weeklyBoots*52/12)} a month`} value={money(-g.weeklyBoots)}/>}
                  {g.debt0>0 && g.pbEff==="sale" && g.weeklyBoots>0 && <Val label={`Interest to ${B.name}`} hint="Until he's paid out of the sale" value={money(-g.weeklyBoots)}/>}
                  {g.isBuilder && g.fronted>0 && <Val label="Repayments from others" value={signed(g.weeklyRecv)} c="pos"/>}
                  <Val label="Tax back" hint={g.joint?"Both people's refunds added up":null} value={signed(r1.taxBack/52)} c={cls(r1.taxBack)}/>
                  <Val label="In pocket" value={money(r1.after/52)} c={cls(r1.after)} strong/>
                </Group>
                <Group title={`Where they land in year ${Y}`}>
                  <Val label="Equity" hint={g.isBuilder&&g.fronted>0?"Includes what others still owe him":g.debt0>0?`After what's still owed to ${B.name}`:null} value={money(g.rows[Y-1].equity)}/>
                  <Val label="Cash if sold" value={money(g.saleNet)}/>
                  <Val label="Profit" value={signed(g.profit)} c={cls(g.profit)} strong/>
                  <Val label="Return a year on their cash" value={pct(g.irr)}/>
                </Group>
              </div>
            );
          })}
        </div>
      </div>}

      {tab==="timeline" && <div className="stack">
        <div className="cols">
          <Group title="Dates" footer="Change these and the chart moves.">
            <NumRow id="startMonth" month label="Start month" hint="When you sign for the block. Type it as 2026-11 if no picker shows" value={p.startMonth} onChange={v=>set("startMonth",v)}/>
            <NumRow id="settleMonths" label="Contract to settlement" unit="mths" value={p.settleMonths} onChange={v=>set("settleMonths",v)}/>
            {isSub(p) && <NumRow id="subMonths" label="Subdivision to new titles" unit="mths" hint="Survey, council approval, civil works, plan sealing" value={p.subMonths} onChange={v=>set("subMonths",v)}/>}
            {isSub(p) && R.sell>0 && <NumRow id="lotSettleMonths" label="Lot sale settles after titles" unit="mths" value={p.lotSettleMonths} onChange={v=>set("lotSettleMonths",v)}/>}
            {isSub(p) && <SegRow label="Build starts" hint="Building before titles needs council to allow it" options={[["titles","After titles"],["settlement","After settlement"]]} value={p.buildStart} onChange={v=>set("buildStart",v)}/>}
            <NumRow id="buildMonths" label="Build time" unit="mths" value={p.buildMonths} onChange={v=>set("buildMonths",v)}/>
            <NumRow id="leaseUpMonths" label="Furnish and find tenants" unit="mths" value={p.leaseUpMonths} onChange={v=>set("leaseUpMonths",v)}/>
          </Group>
          <Group title="Key dates">
            <Val label="Sign for the block" value={monthLabel(p.startMonth,0)}/>
            <Val label="Settlement" value={monthLabel(p.startMonth,R.tl.settleAt)}/>
            {R.tl.sub && <Val label="New titles" value={monthLabel(p.startMonth,R.tl.titlesAt)}/>}
            {R.sell>0 && <Val label="Lot sale money lands" value={monthLabel(p.startMonth,R.tl.lotSaleAt)}/>}
            <Val label="Build starts" value={monthLabel(p.startMonth,R.tl.buildStartAt)}/>
            <Val label="Build finished" value={monthLabel(p.startMonth,R.tl.buildEnd)}/>
            <Val label="First rent" value={monthLabel(p.startMonth,R.tl.rentStart)} strong/>
            {R.groups.filter(g=>g.owes && g.debt0>0).map(g=><Val key={g.i} label={`${g.name}: ${B.name} paid back`} hint={g.pb==="undecided"?"Not decided, weekly assumed":g.pb==="weekly"?"Last weekly payment":g.pb==="sale"?"Out of the sale":g.pb==="cash"?"In cash when it's built":"From a new bank loan when it's built"}
              value={monthLabel(p.startMonth, g.pbEff==="weekly" ? R.tl.rentStart+R.tl.bootsYears*12 : g.pbEff==="sale" ? R.tl.rentStart+Y*12 : R.tl.buildEnd)}/>)}
            {p.loanType==="io" && <Val label="Interest only usually ends" hint="Repayments jump when it rolls to P and I" value={monthLabel(p.startMonth,R.tl.rentStart+60)}/>}
            <Val label={`Sell or review, year ${Y}`} value={monthLabel(p.startMonth,R.tl.rentStart+Y*12)}/>
          </Group>
        </div>

        <section className="gwrap">
          <div className="ghead"><span>Getting it built</span><span>{Math.round(R.tl.rentStart)} months</span></div>
          <div className="chartbox"><Gantt tl={R.tl} startMonth={p.startMonth}/></div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Then owning it</span></div>
          <div className="chartbox"><YearStrip tl={R.tl} Y={Y} loanType={p.loanType} builderName={B.name}/></div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Who pays what, and when</span></div>
          <div className="tablebox">
            <table className="stages">
              <thead><tr><th>Stage</th><th>When</th>{R.groups.map(g=><th key={g.i}>{g.name}</th>)}<th>Total</th></tr></thead>
              <tbody>
                {[
                  { k:"settle", label:"Settlement", hint:"Deposit on land, stamp duty, loan fees", at:R.tl.settleAt, val:iv=>iv.stages.settle, tot:R.stageTotals.settle },
                  R.tl.sub && { k:"sub", label:"Subdivision", hint:"Costs the bank doesn't cover, plus interest", at:R.tl.settleAt, val:iv=>iv.stages.sub, tot:R.stageTotals.sub },
                  R.sell>0 && (p.payDown==="yes"
                    ? { k:"lot", label:"Lot sale", hint:"Goes straight onto the bank loans, not into anyone's pocket", at:R.tl.lotSaleAt, val:iv=>-(iv.loan0-iv.loan), tot:-(R.loanStart-R.loan), muted:true }
                    : { k:"lot", label:"Lot sale", hint:"Money back to each person after tax", at:R.tl.lotSaleAt, val:iv=>iv.stages.lotBack, tot:R.stageTotals.lotBack }),
                  { k:"build", label:"Build", hint:`Progress payments the bank doesn't cover, plus interest${R.fronted>0?`. ${B.name} fronts ${money(R.fronted)}`:""}`, at:R.tl.buildStartAt, val:iv=>iv.stages.build, tot:R.stageTotals.build },
                  R.tl.hasPayBoots && { k:"payBoots", label:`Pay ${B.name} back`, hint:"When it's built. Cash from anyone paying cash, bank money for anyone taking a new loan, back to the builder", at:R.tl.buildEnd+0.01, val:iv=>iv.stages.payBoots, tot:R.stageTotals.payBoots },
                  { k:"fitout", label:"Fit out", hint:"Furniture and other costs", at:R.tl.buildEnd, val:iv=>iv.stages.fitout, tot:R.stageTotals.fitout },
                  { k:"taxBack", label:"Tax return", hint:"Refund on interest paid while building", at:R.tl.rentStart, val:iv=>iv.stages.taxBack, tot:R.stageTotals.taxBack },
                ].filter(Boolean).sort((a,b)=>a.at-b.at).map(r=>(
                  <tr key={r.k} className={r.muted?"muted":""}>
                    <td><div>{r.label}</div><div className="hint">{r.hint}</div></td>
                    <td>{monthLabel(p.startMonth,r.at)}</td>
                    {R.groups.map(g=>{ const v=r.val(g); return <td key={g.i} className={!r.muted&&v<0?"pos":""}>{money(v)}</td>; })}
                    <td className={!r.muted&&r.tot<0?"pos":""}>{money(r.tot)}</td>
                  </tr>
                ))}
                <tr className="total"><td>Total cash in</td><td></td>{R.groups.map(g=><td key={g.i}>{money(g.cashIn)}</td>)}<td>{money(R.cashIn)}</td></tr>
              </tbody>
            </table>
          </div>
          <div className="gfoot">Green numbers are money coming back. The bank pays its share of each stage directly.{R.sell>0&&p.payDown==="yes"?" The grey lot sale row isn't counted in the total, it comes off the loans.":""}</div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Cash the group needs, running total</span></div>
          <div className="chartbox"><CashLine series={series} startMonth={p.startMonth}/></div>
          <div className="gfoot">Peaks at {money(Math.max(...series))} just before first rent, then rent starts covering the loans.</div>
        </section>
      </div>}

      {tab==="years" && <div className="stack">
        {multi && <Group>
          <SelectRow id="view" label="Show" options={[["all","Whole property"], ...R.groups.flatMap(g=>[["g:"+g.gi, g.name], ...(g.joint ? g.members.map(m=>["i:"+m.i, m.name+" only"]) : [])])]} value={viewInv ? view : "all"} onChange={setView}/>
        </Group>}
        <YearTable rows={viewRows} pi={p.loanType==="pi"} showBoots={!!(viewInv && viewInv.debt0>0)} showRecv={!!(viewInv && viewInv.isBuilder && viewInv.fronted>0)}/>
        <Group title={`If sold in year ${Y}`}>
          {(() => { const src = viewInv || R; return <>
            <Val label="Capital gains tax" value={money(-src.cgt)}/>
            <Val label="Cash after loans and tax" value={money(src.saleNet)} strong/>
            <Val label="Total profit" value={signed(src.profit)} c={cls(src.profit)} strong/>
            <Val label="Return a year" value={pct(src.irr)}/>
          </>; })()}
        </Group>
        <div className="gfoot">Year 1 starts when the first tenants move in. Uses QLD transfer duty on the land and QLD land tax on the kept lot, assessed on the group together. Profit on lots sold is taxed as income. Interest paid while building is claimed in that year. Building depreciates at 2.5% a year, fittings and furniture at 20% diminishing. CGT uses the 50% discount. Estimates only, so confirm with your accountant and lender.</div>
      </div>}

      {tab==="notes" && <div className="cols">
        <div className="stack">
          <Group title="Decisions and checks" right={<span>{decisions.filter(d=>p.checks[d.id]).length} of {decisions.length} done</span>} footer="Tick these off as the group settles them. Ticks save on this device.">
            {decisions.map(d=><Check key={d.id} id={d.id} label={d.label} hint={d.hint} checked={p.checks[d.id]} onChange={v=>setCheck(d.id,v)}/>)}
          </Group>
          <Group title="How it's worked out">
            <Note label="Stamp duty" text="QLD general rate on the land price."/>
            <Note label="Land tax" text="QLD individual rates. The block is assessed as one owner, so there's one $600k threshold, not one each."/>
            <Note label="Lot sale profit" text="Taxed as income at each person's rate."/>
            <Note label="Interest while building" text="Claimed as a deduction in the year it's paid."/>
            <Note label="Depreciation" text="2.5% a year on the building. 20% diminishing on fittings and furniture."/>
            <Note label="Loan fees" text="Claimed over 5 years."/>
            <Note label="Sale" text="Selling costs off the top, 50% CGT discount, bank loans and builder debt cleared from the proceeds."/>
            <Note label="Return a year" text="Internal rate of return on each person's own cash, from first rent to the sale year."/>
          </Group>
        </div>
        <div className="stack">
          <Group title="Sharing" footer={IN_VIEWER
              ? (syncState==="on" ? "Changes you make here save to the shared plan and show up for everyone who opens this link, on any device." : syncState==="readonly" ? "You can see the shared plan and play with the numbers, but your changes stay on this device." : "Saved on this device only.")
              : syncUrl
                ? (syncState==="on" ? "Live sync is on. Every change saves to the shared plan within a second or two and every device picks it up within about ten." : syncState==="error" ? "Can't reach the Google script right now. Changes are kept here and sent when it comes back." : "Connecting to the shared plan.")
                : "No shared plan set up yet. Numbers save on this device only. Paste the Google script link here, or put it in sync.json in the repo so nobody has to."}>
            {IN_VIEWER
              ? <Val label="Live sync" value={syncState==="on" ? "On" : syncState==="readonly" ? "Read only" : "Off"} strong/>
              : <>
                {looksLikeSyncUrl(syncUrlRepo)
                  ? <Val label="Sync link" hint="Set in sync.json in the repo" value={syncState==="on" ? "Connected" : syncState==="error" ? "Problem" : "Connecting"} strong c={syncState==="error"?"warnc":""}/>
                  : <NumRow id="syncUrl" text label="Sync link" hint="Web app URL from the Google script, ends in /exec" placeholder="https://script.google.com/macros/s/…/exec" value={syncUrlLocal} onChange={setSyncUrlLocal}/>}
                <button type="button" className="btn" onClick={shareLink}>Copy share link</button>
                <div className="gfoot" style={{padding:"0 16px 12px"}}>Whoever opens the link sees these exact numbers. Good for "have a look at this" without touching the shared plan.</div>
                <button type="button" className="btn" onClick={copyPlanFile}>Copy plan file</button>
                <div className="gfoot" style={{padding:"0 16px 12px"}}>{syncUrl ? "A backup copy of the plan you can keep in plan.json in the repo." : "Paste it into plan.json in the GitHub repo. Everyone gets asked to load it next time they open the page."}</div>
              </>}
          </Group>
          <Group title="Where the starting numbers came from" footer="Checked October 2026. Land price, build cost and finished value are the ones you most need to replace with your own.">
            {SOURCES.map(([what, who, url])=>(
              <div className="src" key={url}><b>{what}</b><span>{who}</span><a href={url} target="_blank" rel="noopener">{url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]}</a></div>
            ))}
          </Group>
        </div>
      </div>}
    </div>

    <div className="bar">
      <div className="in">
        <div className="m"><span>Profit, year {Y}</span><b className={cls(R.profit)}>{signed(R.profit)}</b></div>
        <div className="m"><span>Year 1 per week</span><b className={cls(y1.after)}>{money(y1.after/52)}</b></div>
        <div className="m"><span>Cash in</span><b>{money(R.cashIn)}</b></div>
        <div className="m"><span>First rent</span><b>{monthLabel(p.startMonth,R.tl.rentStart)}</b></div>
      </div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
