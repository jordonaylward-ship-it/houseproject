                   hint={`${(g.s*100).toFixed(0)}% share${g.loan0>0?` · bank loan ${money(g.loan)}`:""}${g.debt0>0?` · owe${g.joint?"":"s"} ${money(g.debt0)}`:""}`}
                   value={<>{money(g.cashIn)} · <span className={cls(g.rows[0].after)}>{money(g.rows[0].after/52)}</span></>}/>
            ))}
          </Group>}

          <section className="gwrap">
            <div className="ghead"><span>Equity each year</span></div>
            <div className="chartbox"><Chart rows={R.rows} cashIn={R.cashIn}/></div>
            <div className="gfoot">What the group holds outright in the kept house. The line is the cash put in.</div>
          </section>

          <Group title="Stress test" right={<span>Per week · Profit yr {Y}</span>} footer="What happens if things go worse than planned.">
            <Val label="As entered" value={<>{money(y1.after/52)} · {money(R.profit)}</>} strong/>
            {stress.map(([t,s])=>(
              <Val key={t} label={t} value={<><span className={cls(s.rows[0].after)}>{money(s.rows[0].after/52)}</span> · <span className={cls(s.profit)}>{money(s.profit)}</span></>}/>
            ))}
          </Group>

          <Group title="Breakeven rent" footer={`Lowest rent ${rentUnit} so the property covers itself in year 1.`}>
            <Val label="Covers costs before tax" value={beBefore===null?"n/a":money(beBefore)}/>
            <Val label="Covers costs after tax back" value={beAfter===null?"n/a":money(beAfter)}/>
            <Val label="You've entered" value={money(isRooms(p)?num(p.roomRent):num(p.weeklyRent))} strong/>
          </Group>
        </div>
      </div>}

      {tab==="costs" && <div className="cols">
        {[0,1].map(col=>(
          <div className="stack" key={col}>
            {col===0 && <Group title="Project">
              <NumRow id="projectName" text label="Name" value={p.projectName} onChange={v=>set("projectName",v)}/>
              <NumRow id="location" text label="Suburb or area" value={p.location} onChange={v=>set("location",v)}/>
            </Group>}
            {SECTIONS.filter((s,i)=> (i<3)===(col===0)).filter(s=>!s.show||s.show(p)).map(s=>(
              <Group key={s.title} title={s.title}
                footer={s.title==="Land" ? `Stamp duty ${money(R.duty)}` :
                        s.title==="Subdivision" ? `Total subdivision ${money(R.subCosts)} · each lot costs ${money(R.perLot)} all up` :
                        s.title==="Build" ? `Build with contingency ${money(R.buildCost)} · saves ${money(R.saving)} against an outside builder` :
                        s.title==="Loan" ? `Bank loans ${money(R.loanStart)}${R.sell>0&&p.payDown==="yes"?` · ${money(R.loan)} after lot sale`:""} · interest, rates and land tax while building ${money(R.holdInt)}` :
                        s.title==="Rent" ? `Full rent ${money(R.weeklyRent)} a week · ${money(R.weeklyRent*52)} a year before empty weeks` : null}>
                {s.fields.filter(f=>!f[4]||f[4](p)).map(([k,l,u,h,,o])=> u==="seg"
                  ? <SegRow key={k} label={l} hint={h} options={o} value={p[k]} onChange={v=>set(k,v)}/>
                  : <NumRow key={k} id={k} label={l} hint={h} unit={u} value={p[k]} onChange={v=>set(k,v)}/>)}
              </Group>
            ))}
            {col===1 && <Group footer={resetArmed ? "This puts every number back to the researched starting figures for everyone. Your ticks and notes stay." : null}>
              <button className={"btn"+(resetArmed?" addnote":"")} style={resetArmed?{color:"var(--red)"}:null}
                onClick={()=>{ if (!resetArmed){ setResetArmed(true); setTimeout(()=>setResetArmed(false), 5000); } else { setResetArmed(false); change(o=>({...DEFAULTS, checks:o.checks||{}, notes:o.notes||[], noteEdits:o.noteEdits||{}})); toast("Back to the researched figures"); } }}>
                {resetArmed ? "Tap again to reset every number" : "Reset to researched figures"}
              </button>
            </Group>}
          </div>
        ))}
      </div>}

      {tab==="people" && <div className="stack">
        <div className="cols">
          <Group title="Ownership" warn={p.splitMode==="custom" && Math.abs(R.shareTotal-100)>0.01}
            footer={p.splitMode==="custom" && Math.abs(R.shareTotal-100)>0.01
              ? `Shares add up to ${R.shareTotal.toFixed(1)}%. They're scaled to 100% in the numbers.`
              : "Each person's bank loan covers their share of the land, subdivision and build. Leave a rate or tax rate blank to use the Costs tab default."}>
            <div className="row">
              <span className="lbl">People</span>
              <span className="stepper">
                <button type="button" aria-label="Fewer people" onClick={()=>setCount(R.inv.length-1)}>−</button>
                <span>{R.inv.length}</span>
                <button type="button" aria-label="More people" onClick={()=>setCount(R.inv.length+1)}>+</button>
              </span>
            </div>
            <SegRow label="Split" options={[["equal","Equal"],["custom","Custom"]]} value={p.splitMode} onChange={v=>set("splitMode",v)}/>
            <SelectRow id="builder" label="Who is the builder" options={R.inv.map(iv=>[String(iv.i), iv.name])} value={String(B.i)} onChange={v=>set("builder",v)}/>
            <NumRow id="bootsYears" label="Weekly payback runs for" unit="yrs" hint="For anyone paying the builder weekly" value={p.bootsYears} onChange={v=>set("bootsYears",v)}/>
            <NumRow id="bootsRate" label={`Interest ${B.name} charges`} unit="%" hint="On weekly payback and on money owed until sale. 0 is no interest" value={p.bootsRate} onChange={v=>set("bootsRate",v)}/>
          </Group>
          <Group title={`Paying ${B.name} back`} footer={`${B.name} pays for the build share of anyone set to "Owes ${B.name}". How each person pays him back is set on their card. ${R.allOwers.length>0?`Right now he fronts ${money(R.fronted)} during the build${R.returned>0?`, and ${money(R.returned)} of that comes straight back when it's built`:""}.`:"Nobody owes him right now."}`}>
            {R.groups.filter(g=>g.owes && g.debt0>0).length===0 && <Val label="Nobody owes him" value=""/>}
            {R.groups.filter(g=>g.owes && g.debt0>0).map(g=><Val key={g.i} label={`${g.name} pay${g.joint?"":"s"} ${B.name}`}
              hint={g.pb==="undecided"?`${money(g.debt0)}. Not decided how, weekly over ${R.tl.bootsYears} years assumed`:g.pb==="weekly"?`${money(g.debt0)} over ${R.tl.bootsYears} years`:g.pb==="cash"?`In cash when it's built, ${monthLabel(p.startMonth,R.tl.buildEnd)}`:g.pb==="sale"?`Out of the sale in year ${Y}${g.weeklyBoots>0?`, plus interest`:""}`:`From a new bank loan when it's built`}
              value={g.pbEff==="weekly"?money(g.weeklyBoots)+" a week":g.pbEff==="sale"&&g.weeklyBoots>0?money(g.weeklyBoots)+" a week interest":money(g.debt0)} c={g.pb==="undecided"?"warnc":""}/>)}
            {B.weeklyRecv>0 && <Val label={`${B.name} gets back each week`} value={money(B.weeklyRecv)} strong/>}
            {B.returned>0 && <Val label={`${B.name} gets back when it's built`} value={money(B.returned)} strong/>}
          </Group>
        </div>

        <div className="people">
          {R.groups.map(g=>{
            const ids = g.members.map(m=>m.i);
            const lead = g.members[0];
            const leadSrc = (p.investors||[])[lead.i] || {};
            const r1 = g.rows[0];
            const fundOpts = [["loan","Bank loan"], ...(g.isBuilder?[]:[["boots",`Owe${g.joint?"":"s"} ${B.name}`]]), ["cash","Own cash"], ["undecided","Not decided"]];
            const others = R.inv.filter(x=>x.i!==lead.i);
            return (
              <div className="person" key={g.i} style={{"--pc": PCOLORS[g.i % PCOLORS.length]}}>
                <div className="phead">
                  <span className="avatar" aria-hidden="true">{g.members.map(m=>(m.name||"?").trim().charAt(0).toUpperCase()).join("")}</span>
                  <span className="pname">{g.name}</span>
                  {g.isBuilder && <span className="pill info">Builder</span>}
                  {g.joint && <span className="pill grey">One loan together</span>}
                  {g.fund==="undecided" && <span className="pill warn">Funding not decided</span>}
                  {g.owes && g.pb==="undecided" && <span className="pill warn">Payback not decided</span>}
                  <span className="pshare">{(g.s*100).toFixed(1)}%</span>
                </div>
                <Group
                  footer={g.fund==="undecided" ? `${g.name} ${g.joint?"haven't":"hasn't"} settled how they're paying. The maths uses a bank loan until you pick.` : g.owes && g.pb==="undecided" ? `${B.name} fronts ${g.joint?"their":"the"} ${money(g.debt0)} build share. How it gets paid back isn't decided yet, so weekly is assumed.` : g.fund==="cash" ? `No bank loan. ${g.joint?"They put their":"Puts the"} whole share in as cash.` : g.joint ? "One bank loan in both names. Each person still claims their own share of the interest and the loss for tax." : null} warn={g.fund==="undecided" || (g.owes && g.pb==="undecided")}>
                  {g.members.map(iv=>{ const src=(p.investors||[])[iv.i]||{}; return (<React.Fragment key={iv.i}>
                    {g.joint && <div className="subhead">{iv.name}</div>}
                    <NumRow id={`n${iv.i}`} text label="Name" value={src.name ?? iv.name} onChange={v=>setInv(iv.i,"name",v)}/>
                    {p.splitMode==="custom"
                      ? <NumRow id={`s${iv.i}`} label="Share" unit="%" value={src.share ?? ""} onChange={v=>setInv(iv.i,"share",v)}/>
                      : <Val label="Share" value={(iv.s*100).toFixed(1)+"%"}/>}
                    <NumRow id={`t${iv.i}`} label="Tax rate" unit="%" hint="Marginal rate incl Medicare" value={src.tax ?? ""} placeholder={String(p.taxRate)} onChange={v=>setInv(iv.i,"tax",v)}/>
                  </React.Fragment>); })}
                  {g.joint && <div className="subhead">Together</div>}
                  <SegRow label="How they pay for their share" options={fundOpts} value={g.fund} onChange={v=>setInvMany(ids,"fund",v)}/>
                  {g.fund==="boots" && <SegRow label={`How they pay ${B.name} back`} hint={g.pb==="undecided"?`Not decided yet. Weekly over ${R.tl.bootsYears} years is assumed in the maths until you pick`:g.pb==="weekly"?`Weekly over ${R.tl.bootsYears} years at ${num(p.bootsRate)}%. Change the terms under Paying ${B.name} back`:g.pb==="cash"?"Pay him in full when the build finishes":g.pb==="sale"?`He's paid out of the sale in year ${Y}${num(p.bootsRate)>0?`, with ${num(p.bootsRate)}% interest along the way`:", nothing until then"}`:"Borrow it from the bank once it's built and valued, then pay the bank"} options={[["weekly","Weekly"],["cash","Cash when built"],["sale","From the sale"],["refinance","New bank loan"],["undecided","Not decided"]]} value={g.pb} onChange={v=>setInvMany(ids,"payback",v)}/>}
                  <NumRow id={`r${lead.i}`} label="Bank interest rate" unit="%" value={leadSrc.rate ?? ""} placeholder={String(p.rate)} onChange={v=>setInvMany(ids,"rate",v)}/>
                  {g.joint
                    ? <div className="row"><span className="lbl">Borrowing together<span className="hint">Change this if they'd each take their own loan</span></span><button type="button" className="hbtn plain" onClick={()=>setInvMany(ids,"jointWith",-1)}>Split up</button></div>
                    : others.length>0 && <SelectRow id={`j${lead.i}`} label="Borrows with" hint="Pick someone to share one bank loan and one payback" options={[["-1","Nobody"], ...others.map(x=>[String(x.i), x.name])]} value="-1" onChange={v=>setInv(lead.i,"jointWith",v)}/>}
                </Group>
                <div className="money">
                <Group title="Their money up front">
                  <Val label="Share of all costs" value={money(g.s*R.totalCost)}/>
                  <Val label={g.joint?"One bank loan together":"Bank loan"} value={money(g.loan0)}/>
                  {g.loan0!==g.loan && <Val label="Bank loan after lot sale" value={money(g.loan)}/>}
                  {g.debt0>0 && g.pbEff==="weekly" && <Val label={`Owe${g.joint?"":"s"} ${B.name} for the build`} hint={g.pb==="undecided"?`How it's paid back isn't decided. Weekly over ${R.tl.bootsYears} years assumed`:`Paid back weekly over ${R.tl.bootsYears} years`} value={money(g.debt0)} c={g.pb==="undecided"?"warnc":""}/>}
                  {g.debt0>0 && g.pbEff==="cash" && <Val label={`Pay ${B.name} when built`} hint={`Cash needed ${monthLabel(p.startMonth,R.tl.buildEnd)}`} value={money(g.payNow)} c="warnc"/>}
                  {g.debt0>0 && g.pbEff==="sale" && <Val label={`Owe${g.joint?"":"s"} ${B.name} until sale`} hint={`Comes off their share of the sale in year ${Y}`} value={money(g.debt0)}/>}
                  {g.debt0>0 && g.pbEff==="refinance" && <Val label="New bank loan when built" hint={`Pays ${B.name} out. Total bank loans ${money(g.loan+g.refi)}, ${pct(g.lvrAfter)} of their share of the finished value${g.lvrAfter>0.8?". Over 80% is hard to get":""}`} value={money(g.refi)} c={g.lvrAfter>0.8?"warnc":""}/>}
                  {g.isBuilder && g.fronted>0 && <Val label="Fronts for others during the build" hint={g.returned>0?`${money(g.returned)} comes back when it's built`:null} value={money(g.fronted)} c="warnc"/>}
                  {g.isBuilder && g.fee>0 && <Val label="Fee for the build" hint="Paid by the group when it's finished, before his tax on it" value={money(-g.fee)} c="pos"/>}
                  <Val label="Cash to put in" hint="Own share of costs, interest and rates while building, less loans and lot sale money" value={money(g.cashIn)} strong/>
                </Group>
                <Group title="Their money each week, year 1">
                  <Val label="Rent share" value={money(r1.rent/52)} c="pos"/>
                  <Val label="Costs share" value={money(-r1.costs/52)}/>
                  {g.loan+g.refi>0 && <Val label={`Bank repayment at ${g.rPct.toFixed(2)}%`} hint={`${money(g.weeklyRepay*52/12)} a month${g.refi>0?", includes the build loan":""}${g.weeklyRepayPI!==null && g.weeklyRepayPI>g.weeklyRepay+0.5 ? `. Jumps to ${money(g.weeklyRepayPI)} a week in year ${R.ioYears+1} when interest only ends` : ""}`} value={money(-g.weeklyRepay)}/>}
                  {g.debt0>0 && g.pbEff==="weekly" && <Val label={`Repayment to ${B.name}`} hint={`${money(g.weeklyBoots*52/12)} a month`} value={money(-g.weeklyBoots)}/>}
                  {g.debt0>0 && g.pbEff==="sale" && g.weeklyBoots>0 && <Val label={`Interest to ${B.name}`} hint="Until he's paid out of the sale" value={money(-g.weeklyBoots)}/>}
                  {g.isBuilder && g.fronted>0 && <Val label="Repayments from others" value={signed(g.weeklyRecv)} c="pos"/>}
                  <Val label="Tax back" hint={g.joint?"Both people's refunds added up":null} value={signed(r1.taxBack/52)} c={cls(r1.taxBack)}/>
                  <Val label="In pocket" value={money(r1.after/52)} c={cls(r1.after)} strong/>
                </Group>
                <Group title={`Where they land in year ${Y}`}>
                  <Val label="Equity" hint={g.isBuilder&&g.fronted>0?"Includes what others still owe him":g.debt0>0?`After what's still owed to ${B.name}`:null} value={money(g.rows[Y-1].equity)}/>
                  <Val label="Cash if sold" value={money(g.saleNet)}/>
                  <Val label="Profit" value={signed(g.profit)} c={cls(g.profit)} strong/>
                  <Val label="Return a year on their cash" value={pct(g.irr)}/>
                </Group>
                </div>
              </div>
            );
          })}
        </div>
      </div>}

      {tab==="timeline" && <div className="stack">
        <div className="cols">
          <Group title="Dates" footer="Change these and the chart moves.">
            <NumRow id="startMonth" month label="Start month" hint="When you sign for the block. Type it as 2026-11 if no picker shows" value={p.startMonth} onChange={v=>set("startMonth",v)}/>
            <NumRow id="settleMonths" label="Contract to settlement" unit="mths" value={p.settleMonths} onChange={v=>set("settleMonths",v)}/>
            {isSub(p) && <NumRow id="subMonths" label="Subdivision to new titles" unit="mths" hint="Survey, council approval, civil works, plan sealing" value={p.subMonths} onChange={v=>set("subMonths",v)}/>}
            {isSub(p) && R.sell>0 && <NumRow id="lotSettleMonths" label="Lot sale settles after titles" unit="mths" value={p.lotSettleMonths} onChange={v=>set("lotSettleMonths",v)}/>}
            {isSub(p) && <SegRow label="Build starts" hint="Building before titles needs council to allow it" options={[["titles","After titles"],["settlement","After settlement"]]} value={p.buildStart} onChange={v=>set("buildStart",v)}/>}
            <NumRow id="buildMonths" label="Build time" unit="mths" value={p.buildMonths} onChange={v=>set("buildMonths",v)}/>
            <NumRow id="leaseUpMonths" label="Furnish and find tenants" unit="mths" value={p.leaseUpMonths} onChange={v=>set("leaseUpMonths",v)}/>
          </Group>
          <Group title="Key dates">
            <Val label="Sign for the block" value={monthLabel(p.startMonth,0)}/>
            <Val label="Settlement" value={monthLabel(p.startMonth,R.tl.settleAt)}/>
            {R.tl.sub && <Val label="New titles" value={monthLabel(p.startMonth,R.tl.titlesAt)}/>}
            {R.sell>0 && <Val label="Lot sale money lands" value={monthLabel(p.startMonth,R.tl.lotSaleAt)}/>}
            <Val label="Build starts" value={monthLabel(p.startMonth,R.tl.buildStartAt)}/>
            <Val label="Build finished" value={monthLabel(p.startMonth,R.tl.buildEnd)}/>
            <Val label="First rent" value={monthLabel(p.startMonth,R.tl.rentStart)} strong/>
            {R.groups.filter(g=>g.owes && g.debt0>0).map(g=><Val key={g.i} label={`${g.name}: ${B.name} paid back`} hint={g.pb==="undecided"?"Not decided, weekly assumed":g.pb==="weekly"?"Last weekly payment":g.pb==="sale"?"Out of the sale":g.pb==="cash"?"In cash when it's built":"From a new bank loan when it's built"}
              value={monthLabel(p.startMonth, g.pbEff==="weekly" ? R.tl.rentStart+R.tl.bootsYears*12 : g.pbEff==="sale" ? R.tl.rentStart+Y*12 : R.tl.buildEnd)}/>)}
            {p.loanType==="io" && R.ioYears>0 && R.ioYears<10 && <Val label="Interest only ends" hint={`Group bank repayments go from ${money(R.rows[R.ioYears-1].interest/52)} to ${money((R.rows[R.ioYears].interest+R.rows[R.ioYears].principal)/52)} a week on P and I`} value={monthLabel(p.startMonth,R.tl.rentStart+R.ioYears*12)}/>}
            <Val label={`Sell or review, year ${Y}`} value={monthLabel(p.startMonth,R.tl.rentStart+Y*12)}/>
          </Group>
        </div>

        <section className="gwrap">
          <div className="ghead"><span>Getting it built</span><span>{Math.round(R.tl.rentStart)} months</span></div>
          <div className="chartbox"><Gantt tl={R.tl} startMonth={p.startMonth}/></div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Then owning it</span></div>
          <div className="chartbox"><YearStrip tl={R.tl} Y={Y} loanType={p.loanType} builderName={B.name}/></div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Who pays what, and when</span></div>
          <div className="tablebox">
            <table className="stages">
              <thead><tr><th>Stage</th><th>When</th>{R.groups.map(g=><th key={g.i}>{g.name}</th>)}<th>Total</th></tr></thead>
              <tbody>
                {[
                  { k:"settle", label:"Settlement", hint:"Deposit on land, stamp duty, loan fees", at:R.tl.settleAt, val:iv=>iv.stages.settle, tot:R.stageTotals.settle },
                  R.tl.sub && { k:"sub", label:"Subdivision", hint:"Costs the bank doesn't cover, plus interest, rates and land tax while you wait", at:R.tl.settleAt, val:iv=>iv.stages.sub, tot:R.stageTotals.sub },
                  R.sell>0 && (p.payDown==="yes"
                    ? { k:"lot", label:"Lot sale", hint:"Goes straight onto the bank loans, not into anyone's pocket", at:R.tl.lotSaleAt, val:iv=>-(iv.loan0-iv.loan), tot:-(R.loanStart-R.loan), muted:true }
                    : { k:"lot", label:"Lot sale", hint:"Money back to each person after tax", at:R.tl.lotSaleAt, val:iv=>iv.stages.lotBack, tot:R.stageTotals.lotBack }),
                  { k:"build", label:"Build", hint:`Progress payments the bank doesn't cover, plus interest and rates${R.fronted>0?`. ${B.name} fronts ${money(R.fronted)}`:""}${R.fee>0?`. His ${money(R.fee)} fee comes off his column`:""}`, at:R.tl.buildStartAt, val:iv=>iv.stages.build, tot:R.stageTotals.build },
                  R.tl.hasPayBoots && { k:"payBoots", label:`Pay ${B.name} back`, hint:"When it's built. Cash from anyone paying cash, bank money for anyone taking a new loan, back to the builder", at:R.tl.buildEnd+0.01, val:iv=>iv.stages.payBoots, tot:R.stageTotals.payBoots },
                  { k:"fitout", label:"Fit out", hint:"Furniture and other costs", at:R.tl.buildEnd, val:iv=>iv.stages.fitout, tot:R.stageTotals.fitout },
                ].filter(Boolean).sort((a,b)=>a.at-b.at).map(r=>(
                  <tr key={r.k} className={r.muted?"muted":""}>
                    <td><div>{r.label}</div><div className="hint">{r.hint}</div></td>
                    <td>{monthLabel(p.startMonth,r.at)}</td>
                    {R.groups.map(g=>{ const v=r.val(g); return <td key={g.i} className={!r.muted&&v<0?"pos":""}>{money(v)}</td>; })}
                    <td className={!r.muted&&r.tot<0?"pos":""}>{money(r.tot)}</td>
                  </tr>
                ))}
                <tr className="total"><td>Total cash in</td><td></td>{R.groups.map(g=><td key={g.i}>{money(g.cashIn)}</td>)}<td>{money(R.cashIn)}</td></tr>
              </tbody>
            </table>
          </div>
          <div className="gfoot">Green numbers are money coming back. The bank pays its share of each stage directly.{R.sell>0&&p.payDown==="yes"?" The grey lot sale row isn't counted in the total, it comes off the loans.":""}</div>
        </section>

        <section className="gwrap">
          <div className="ghead"><span>Cash the group needs, running total</span></div>
          <div className="chartbox"><CashLine series={series} startMonth={p.startMonth}/></div>
          <div className="gfoot">Peaks at {money(Math.max(...series))} just before first rent, then rent starts covering the loans.</div>
        </section>
      </div>}

      {tab==="years" && <div className="stack">
        {multi && <Group>
          <SelectRow id="view" label="Show" options={[["all","Whole property"], ...R.groups.flatMap(g=>[["g:"+g.gi, g.name], ...(g.joint ? g.members.map(m=>["i:"+m.i, m.name+" only"]) : [])])]} value={viewInv ? view : "all"} onChange={setView}/>
        </Group>}
        <YearTable rows={viewRows} pi={viewRows.some(r=>r.principal>0.5)} showBoots={!!(viewInv && viewInv.debt0>0)} showRecv={!!(viewInv && viewInv.isBuilder && viewInv.fronted>0)}/>
        <Group title={`If sold in year ${Y}`}>
          {(() => { const src = viewInv || R; return <>
            <Val label="Capital gains tax" value={money(-src.cgt)}/>
            <Val label="Cash after loans and tax" value={money(src.saleNet)} strong/>
            <Val label="Total profit" value={signed(src.profit)} c={cls(src.profit)} strong/>
            <Val label="Return a year" value={pct(src.irr)}/>
          </>; })()}
        </Group>
        <div className="gfoot">Year 1 starts when the first tenants move in. Uses QLD transfer duty on the land and QLD land tax on the kept lot, assessed on the group together. Profit on the lot sold is taxed as income. Interest and rates while building can't be claimed, they lower the capital gain instead. Building depreciates at 2.5% a year, fittings and furniture at 20% diminishing.{R.ioYears>0 && R.ioYears<10 ? ` The loan is interest only for ${R.ioYears} years, then principal and interest.` : ""} CGT uses the 50% discount, which new builds keep. Estimates only, so confirm with your accountant and lender.</div>
      </div>}

      {tab==="notes" && <div className="cols">
        <div className="stack">
          <Group title="Decisions and checks" right={<span>{items.filter(d=>p.checks[d.id]).length} of {items.length} done</span>} footer="Tick things off as the group settles them. Tap Edit to change the wording or hide one, or add your own at the bottom. Ticks and notes are shared with everyone.">
            {items.map(it => editing===it.id
              ? <NoteEditor key={it.id} draft={draft} setDraft={setDraft} onSave={()=>saveEdit(it)} onCancel={()=>cancelEdit(it)} onRemove={()=>removeItem(it)} removeLabel={it.builtin?"Hide":"Delete"} onReset={it.builtin && it.edited ? ()=>resetItem(it) : null}/>
              : <Check key={it.id} id={it.id} label={it.label} hint={it.hint} checked={p.checks[it.id]} onChange={v=>setCheck(it.id,v)} onEdit={()=>startEdit(it)}/>)}
            <button type="button" className="btn addnote" onClick={addNote}>Add a note</button>
            {hiddenCount>0 && <button type="button" className="btn addnote" onClick={unhideAll}>Show {hiddenCount} hidden</button>}
          </Group>
          <Group title="How it's worked out">
            <Note label="Stamp duty" text="QLD general rate on the land price."/>
            <Note label="Land tax" text="QLD individual rates. The block is assessed as one owner, so there's one $600k threshold, not one each."/>
            <Note label="Lot sale profit" text="Taxed as income at each person's rate, after the sold lot's share of the costs."/>
            <Note label="Interest, rates and land tax while building" text="Can't be claimed. Since 2019 the ATO treats land with a house going up on it as vacant land. These costs are added to the cost base, so they cut the capital gains tax when you sell."/>
            <Note label="Negative gearing" text="Rental losses are claimed against each person's wages. From 1 July 2027 only new builds can do this, and a new house on a new lot is a new build."/>
            <Note label="Depreciation" text="2.5% a year on the building. 20% diminishing on fittings and furniture. Only new items qualify, which these are."/>
            <Note label="Loan fees" text="Claimed over 5 years by the people with a bank loan."/>
            <Note label="Bank loan" text={R.ioYears>0 && R.ioYears<10 ? `Interest only for the first ${R.ioYears} rental years, then principal and interest over what's left of the ${num(p.term)} year term.` : p.loanType==="io" ? "Interest only the whole way through." : `Principal and interest over ${num(p.term)} years.`}/>
            <Note label="Sale" text="Selling costs off the top, 50% CGT discount, bank loans and builder debt cleared from the proceeds."/>
            <Note label="Return a year" text="Internal rate of return on each person's own cash, counted from the day the block is signed for. The build years with no rent count against it."/>
          </Group>
        </div>
        <div className="stack">
          <Group title="Where the starting numbers came from" footer="Checked November 2026. Land price, build cost and finished value are the ones you most need to replace with your own.">
            {SOURCES.map(([what, who, url])=>(
              <div className="src" key={url}><b>{what}</b><span>{who}</span><a href={url} target="_blank" rel="noopener">{url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0]}</a></div>
            ))}
          </Group>
        </div>
      </div>}
    </div>

    <div className="bar">
      <div className="in">
        <div className="m"><span>Profit, year {Y}</span><b className={cls(R.profit)}>{signed(R.profit)}</b></div>
        <div className="m"><span>Year 1 per week</span><b className={cls(y1.after)}>{money(y1.after/52)}</b></div>
        <div className="m"><span>Cash in</span><b>{money(R.cashIn)}</b></div>
        <div className="m"><span>First rent</span><b>{monthLabel(p.startMonth,R.tl.rentStart)}</b></div>
      </div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
